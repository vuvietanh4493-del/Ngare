}
function wearOf(t){return t.wear||0}
function wearTxt(w){return w<0.25?'mới':w<0.5?'còn tốt':w<0.7?'cũ':w<0.9?'xuống cấp':'rất tồi tàn'}
function renoBase(G,t){return BCOST[t.t]?buildCost(G,t.t,Math.max(1,Math.min(BCOST[t.t].length,t.lv))):(t.cost>0?t.cost:K(G,1500))}
function renoCost(G,t){
  if(!t||t.t==='empty'||!WEAR_Q[t.t])return 0;
  return Math.round(renoBase(G,t)*(0.1+0.4*wearOf(t)));
}
function renovateTile(G,i){
  var t=G.T[i];if(G.P.jail>0)return 'Mày đang thụ án.';
  if(!t||!t.own||t.proj||t.t==='empty'||!WEAR_Q[t.t])return 'Không cải tạo được ô này.';
  if(wearOf(t)<0.12)return 'Công trình còn mới, chưa cần cải tạo.';
  var c=renoCost(G,t);if(G.cash<c)return 'Không đủ tiền cải tạo (cần '+c+' triệu).';
  G.cash-=c;t.wear=0.08;t.cost=(t.cost>0?t.cost:bldVal(G,t))+Math.round(c*0.4);
  logm(G,'Mày cải tạo '+BLD[t.t].toLowerCase()+' ở '+DIST[t.d].name+' hết '+c+' triệu: công trình như mới.','news');return '';
}
function renoAllInfo(G,th){
  th=th===undefined?0.55:th;var n=0,c=0;
  G.T.forEach(function(t){if(t.own&&!t.proj&&t.t!=='empty'&&WEAR_Q[t.t]&&wearOf(t)>=th){n++;c+=renoCost(G,t)}});
  return {n:n,c:c};
}
function renovateAll(G,th){
  if(G.P.jail>0)return 'Mày đang thụ án.';
  th=th===undefined?0.55:th;var list=[];
  G.T.forEach(function(t,i){if(t.own&&!t.proj&&t.t!=='empty'&&WEAR_Q[t.t]&&wearOf(t)>=th)list.push(i)});
  if(!list.length)return 'Không có công trình nào cần cải tạo.';
  list.sort(function(a,b){return wearOf(G.T[b])-wearOf(G.T[a])});
  var n=0,c=0;
  for(var j=0;j<list.length;j++){var t=G.T[list[j]],cc=renoCost(G,t);if(G.cash<cc)break;G.cash-=cc;c+=cc;t.wear=0.08;t.cost=(t.cost>0?t.cost:bldVal(G,t))+Math.round(cc*0.4);n++}
  if(!n)return 'Không đủ tiền cho công trình nào (cần '+renoCost(G,G.T[list[0]])+' triệu cho ô xuống cấp nhất).';
  logm(G,'Mày cải tạo '+n+' công trình xuống cấp, hết '+c+' triệu.','news');return '';
}
/* bộ phận điều chỉnh giá trị, thu nhập theo độ hao mòn */
function wearVal(t){var w=wearOf(t);return 1-0.45*w*w}
function wearInc(t){var w=wearOf(t);return 1-0.5*w*w}
function decayStep(G,evs){
  var renew=0,sumW=0,nW=0;
  G.T.forEach(function(t,i){
    var ty=t.t;
    if(ty==='road'||ty==='bridge'||ty==='water'||ty==='locked')return;
    if(ty==='empty'){t.wsig='e';t.wear=0;return}
    if(t.proj)return;
    var sg=ty+'|'+t.lv;
    if(t.wsig===undefined){t.wsig=sg;if(t.wear===undefined)t.wear=Math.random()*0.18}
    else if(t.wsig!==sg){t.wsig=sg;t.wear=0}
    if(t.grow<1){t.wear=0;return}
    if(!WEAR_Q[ty])return;
    t.wear=Math.min(1.2,(t.wear||0)+wearRate(G,t));
    sumW+=t.wear;nW++;
    if(t.own){
      if(t.wear>=1&&Math.random()<0.045){
        var fd=K(G,15)+Math.round(0.06*bldVal(G,t)),nm=BLD[ty].toLowerCase();
        G.cash-=fd;addMark(G,'legal',2);G.P.rep=clamp(G.P.rep-2,0,100);
        if(t.lv>1){t.lv--;t.grow=0;t.cost=Math.round(t.cost*0.6);t.wear=0;logm(G,'Sự cố: '+nm+' xuống cấp quá mức ở '+DIST[t.d].name+' bị hư hỏng nặng, mất một cấp. Chi phí khắc phục '+fd+' triệu.','bad')}
        else{t.t='empty';t.lv=0;t.cost=0;t.grow=1;t.wear=0;t.wsig='e';t.illegal=false;t.defect=false;t.big=false;if(G.P.emp===i){G.P.emp=-1;G.P.jobless=0}if(G.co&&G.co.tile===i)G.co.tile=-1;logm(G,'Sự cố: '+nm+' xuống cấp quá mức ở '+DIST[t.d].name+' sập, phải dọn dẹp. Chi phí '+fd+' triệu, ô trở lại đất trống của mày.','bad')}
      }
    }else if(t.wear>=0.92&&!t.qh&&Math.random()<0.07){
      /* thành phố tự đập đi xây lại; loại công trình có thể đổi theo thời đại */
      var keep=(G.P.emp===i)||(G.co&&G.co.tile===i)||G.stakes.some(function(s){return s.i===i});
      t.wear=0;t.grow=0;renew++;
      if(!keep&&['res','com','ind','office','hotel','fin','farm'].indexOf(ty)>=0&&Math.random()<0.45){
        var needs={res:1,com:0.7,ind:0.6,office:0.6,hotel:0.3,fin:0.3},tp,tries=0,ok=false;
        for(var k in needs){var pf=prefOf(G,t.d,k);needs[k]=pf>0?needs[k]*eraN(G,k)*pf:0}
        while(tries++<4&&!ok){tp=pickType(needs);if(tp&&tp!==ty){t.t=tp;ok=true;var mx=BCOST[tp]?BCOST[tp].length:3;if(t.lv>mx)t.lv=mx}}
      }
      if(t.lv>1&&Math.random()<0.25)t.lv--;
      t.wsig=t.t+'|'+t.lv;
    }
  });
  G.avgWear=nW?sumW/nW:0;
  if(renew>2)logm(G,'Thành phố đang tái thiết: '+renew+' công trình cũ được đập đi xây lại trong quý này.','news');
}
function wearStats(G){
  var o={n:0,old:0,bad:0,sum:0,val:0,cost:0};
  G.T.forEach(function(t){if(t.own&&!t.proj&&t.t!=='empty'&&WEAR_Q[t.t]){o.n++;o.sum+=wearOf(t);if(wearOf(t)>=0.6)o.old++;if(wearOf(t)>=0.85)o.bad++}});
  o.avg=o.n?o.sum/o.n:0;return o;
}

ACH.splice(ACH.length-1,0,{id:'chungnhan',name:'Chứng nhân thời đại',desc:'Sống qua hai lần thành phố đổi thời đại trong cùng một đời người.',test:function(G){return (G.stats.eras||0)>=2}});

/* =====================================================================
   GIA TỘC ĐỐI THỦ (mục 2): anh chị em của người kế nghiệp, các gia tộc lâu đời,
   gom cổ phiếu để thâu tóm công ty niêm yết của người chơi, mua tài sản của công ty phá sản.
   Cơ sở pháp lý dùng để dựng luật chơi (đã đối chiếu qua bài tổng hợp, cần xem lại văn bản gốc):
   - Luật Chứng khoán 2019 Điều 4 khoản 18: cổ đông lớn là người nắm từ 5% cổ phiếu có quyền biểu quyết.
   - Luật Chứng khoán 2019 Điều 127: cổ đông lớn phải công bố thông tin khi thành/không còn là cổ đông lớn và khi thay đổi qua mỗi ngưỡng 1%.
   - Luật Chứng khoán 2019 Điều 35: mua để đạt từ 25% cổ phiếu có quyền biểu quyết phải chào mua công khai, sau đó lặp lại ở các mốc 35%, 45%, 55%, 65%, 75%; miễn khi nhận thừa kế.
   - Luật Doanh nghiệp 2020 Điều 148: nghị quyết ĐHĐCĐ thông qua khi trên 50% tổng số phiếu của cổ đông dự họp; vấn đề quan trọng cần từ 65%.
   Mọi hệ số xác suất, giá chào mua, tốc độ gom là số liệu mô phỏng của trò chơi, tạm tính.
   ===================================================================== */
var DYN_MARKS=[0.25,0.35,0.45,0.55];
var DYN_INST=0.10;          /* phần cổ phiếu do quỹ, tổ chức giữ dài hạn, không ai mua được */
var DYN_SN=['Trần','Lê','Phạm','Hoàng','Vũ','Đặng','Bùi','Ngô','Đỗ','Hồ','Dương','Lý'];
function dynNews(G,sec,t,imp){
  if(!G.dyn)return;if(!G.dyn.log)G.dyn.log=[];G.dyn.log.push({q:G.q,t:t});if(G.dyn.log.length>20)G.dyn.log.shift();
  if(!G.botlog)G.botlog=[];G.botlog.push({q:G.q,t:t,sec:sec||''});if(G.botlog.length>16)G.botlog.shift();
  if(imp)logm(G,t,imp===2?'bad':'news');
}
function dynCo(G){return G.co&&!G.co.closed&&G.co.listed?G.co:null}
function dynBot(G,f){
  if(!f.bid||!G.mkt||!G.mkt[f.sec])return null;
  var arr=G.mkt[f.sec].bots,i;for(i=0;i<arr.length;i++)if(arr[i].id===f.bid&&arr[i].alive)return arr[i];return null;
}
function dynFamByBot(G,b){var i;if(!G.dyn||!b.fam)return null;for(i=0;i<G.dyn.fams.length;i++)if(G.dyn.fams[i].id===b.fam)return G.dyn.fams[i];return null}
function dynSumSh(G){var s=0;(G.dyn?G.dyn.fams:[]).forEach(function(f){if(!f.dead)s+=f.sh});return s}
function dynFloat(G){var co=dynCo(G);if(!co)return 0;return Math.max(0,1-co.eq-(co.allied||0)-dynSumSh(G)-DYN_INST)}
function dynAllySh(G){var s=0;(G.dyn?G.dyn.fams:[]).forEach(function(f){if(!f.dead&&f.ally)s+=f.sh});return s}
function dynCtrl(G){var co=dynCo(G);return co?co.eq+(co.allied||0)+dynAllySh(G):0}
function dynTop(G){var t=null;(G.dyn?G.dyn.fams:[]).forEach(function(f){if(!f.dead&&!f.ally&&(!t||f.sh>t.sh))t=f});return t}
function dynMarkOf(sh){var n=0;DYN_MARKS.forEach(function(m){if(sh>=m)n++});return n}
function dynBizVal(G,f){
  var b=dynBot(G,f);if(!b)return 0;
  var S=SECTORS[f.sec];return S.pe*4*coBase(b.lvl)*G.infl*S.m*0.7;
}
function dynWealth(G,f){
  var co=dynCo(G);
  return f.cash+f.assets*G.infl+dynBizVal(G,f)+(co?f.sh*co.mc:0);
}
function dynFamName(f,sec){
  var p=f.style==='aggr'?'Tập đoàn ':f.style==='start'?'Startup ':'Công ty ';
  return p+f.sn+' '+SEC_SHORT[sec];
}
function dynMake(G,o){
  var D=G.dyn,f={id:++D.id,name:o.name,sn:o.sn,kin:!!o.kin,rel:o.rel||'',resent:o.resent||0,sec:o.sec,style:o.style,cash:Math.round(o.cash),assets:o.assets||0,sh:o.sh||0,mark:0,gen:1,born:G.q,age:0,life:ri(92,112),bid:0,ally:false,peace:-99,tq:-99,fallen:-1,wins:0,dead:false,disc:false};
  f.mark=dynMarkOf(f.sh);if(f.sh>=0.05)f.disc=true;
  if(o.lvl>0&&G.mkt&&G.mkt[o.sec]){
    var b=mkBot(G,o.sec,o.style,o.lvl);b.fam=f.id;b.name=dynFamName(f,o.sec);G.mkt[o.sec].bots.push(b);f.bid=b.id;
  }
  D.fams.push(f);return f;
}
function dynInit(G){
  G.dyn={fams:[],id:0,log:[],coKey:'',lastEgm:-99,lost:[],won:0,defended:0};
  var key=G.diff||'normal',d=DIFF[key];if(!d||d.d===0||!G.mkt)return G.dyn;
  var n=({easy:1,normal:2,hard:3})[key]||2,secs=shuf(SK.slice()),sn=shuf(DYN_SN.slice()),i;
  for(i=0;i<n;i++)dynMake(G,{name:'Gia tộc '+sn[i],sn:sn[i],sec:secs[i],style:['aggr','safe','start'][i%3],lvl:2+(i%2),cash:K(G,rnd(250,500)),kin:false});
  return G.dyn;
}

/* ---------- anh chị em của người kế nghiệp ---------- */
function dynKinPlan(G,o){
  var par=G.P,k=par.fam.kids||0,sp=par.fam.married?1:0,f=o.f;
  if(k<2||f>=0.999||!o.id||o.id==='rel')return [];
  var d=DIFF[G.diff||'normal'];if(!d||d.d===0)return [];
  var nw=Math.max(0,netWorth(G));if(nw<=0)return [];
  var n=k+sp,e=1/n,rest=1-f,sibN=k-1,spS=sp?Math.min(rest,Math.max(2/3*e,rest/(sibN+1))):0,sibS=Math.max(0,(rest-spS)/sibN);
  if(sibS<0.02)return [];
  var tr=Math.min(sibN,3),each=sibS*sibN/tr,co=G.co&&!G.co.closed?G.co:null,out=[],i;
  var heirKeeps=co&&co.eq*f>=0.05;
  for(i=0;i<tr;i++){
    var sh=co&&co.listed&&heirKeeps?co.eq*each:0,W=nw*each;
    out.push({share:each,W:W,sh:sh,cashW:Math.max(0,W-sh*(co&&co.listed?co.mc:0))});
  }
  return out;
}
function dynKin(G,o,heirName){
  var plan=dynKinPlan(G,o);if(!plan.length||!G.dyn)return 0;
  var co=G.co&&!G.co.closed?G.co:null,used={};
  G.dyn.fams.forEach(function(f){used[f.sn]=1});
  var names=shuf(CM_NAMES.slice()).filter(function(x){return !used[x]}),made=0;
  plan.forEach(function(p,i){
    var first=names[i]||('Em '+(i+1)),W=p.cashW;
    var sec=(co&&Math.random()<0.4)?co.sec:SK[Math.floor(Math.random()*SK.length)],lv=1,spent=0;
    while(lv<6&&W*0.55>=spent+coUpCost(G,lv)){spent+=coUpCost(G,lv);lv++}
    var resent=clamp(15+(-(o.harm||0))*2.5+ri(-5,12)+(G.P.record?10:0),0,95);
    var style=resent>55?'aggr':(['safe','start','aggr'][Math.floor(Math.random()*3)]);
    dynMake(G,{name:'Nhà '+first,sn:first,rel:'anh chị em ruột của '+heirName,kin:true,resent:resent,sec:sec,style:style,lvl:lv,cash:Math.max(K(G,20),W-spent*0.5),sh:p.sh});
    made++;
  });
  return made;
}
function dynKinText(G,o){
  var plan=dynKinPlan(G,o);if(!plan.length)return '';
  var co=G.co&&!G.co.closed?G.co:null,p=plan[0],sh=plan.reduce(function(a,x){return a+x.sh},0);
  return plan.length+' người anh chị em sẽ nhận mỗi người khoảng '+fmtN(p.W)+(sh>0?', kèm '+Math.round(p.sh*1000)/10+'% cổ phiếu "'+co.name+'" mỗi người':'')+'. Họ không biến mất: họ lập công ty riêng, cạnh tranh trong thành phố'+(sh>0?' và có thể gom thêm cổ phiếu để giành quyền kiểm soát công ty niêm yết':'')+'. Chia càng lệch cho người kế nghiệp thì họ càng hằn học.';
}

/* ---------- mỗi quý ---------- */
function dynStep(G,evs){
  var D=G.dyn;if(!D||!D.fams.length||!G.mkt)return;
  var dd=DIFF[G.diff||'normal'];if(!dd||dd.d===0)return;
  var co=dynCo(G),key=co?co.name+'|'+co.ipoQ:'';
  if(D.coKey!==key){D.fams.forEach(function(f){f.sh=0;f.mark=0;f.ally=false;f.disc=false});D.coKey=key;if(G.co)G.co.allied=0}
  var mx=botMaxLvl(G),given=false,top;
  D.fams.forEach(function(f){
    if(f.dead)return;
    f.age++;
    var b=dynBot(G,f),S=SECTORS[f.sec];
    if(f.bid&&!b){f.bid=0;if(f.fallen<0)f.fallen=G.q}
    if(f.kin)f.resent=clamp(f.resent+(f.resent>20?-0.35:0.1),0,100);
    if(b){
      var dem=coDemand(G,f.sec),pr=coBase(b.lvl)*G.infl*Math.max(-0.03,b.profit)*dem*rnd(0.8,1.15);
      f.cash+=pr*0.55;
      var cost=coUpCost(G,b.lvl);
      if(b.lvl<Math.min(CO_MAXLV-1,mx)&&f.cash>cost*(f.style==='safe'?2.5:1.7)&&Math.random()<(f.style==='aggr'?0.45:0.2)){f.cash-=cost;b.lvl++}
    }else if(f.cash>K(G,700)&&Math.random()<0.12&&G.mkt[f.sec]){
      var nb=mkBot(G,f.sec,f.style,1+(f.cash>K(G,2500)?1:0));nb.fam=f.id;nb.name=dynFamName(f,f.sec);G.mkt[f.sec].bots.push(nb);f.bid=nb.id;f.cash-=K(G,300);f.fallen=-1;
      dynNews(G,f.sec,f.name+' lập công ty mới trong ngành '+SEC_SHORT[f.sec]+'.',0);
    }
    f.cash+=f.assets*G.infl*0.01;
    f.cash-=K(G,3);   /* chi tiêu gia đình */
    if(!b&&f.cash<K(G,30)&&f.assets<=0&&f.sh<=0.001&&G.q-f.born>8){f.dead=true;dynNews(G,f.sec,f.name+' lụi tàn, không còn cơ nghiệp.',0);return}
    /* cổ phiếu công ty của người chơi */
    if(co){
      if(f.sh>0)f.cash+=Math.max(0,co.profit)*co.div*f.sh*0.95;
      if(f.cash<0&&f.sh>0){var sl=Math.min(f.sh,(-f.cash)/(co.mc*0.98)+0.01);f.sh-=sl;f.cash+=sl*co.mc*0.98}
      var amb=f.style==='aggr'?0.32:f.style==='start'?0.2:0.09;
      if(f.kin)amb*=0.2+f.resent/55;
      if(f.kin&&f.sh>co.eq*0.9&&f.resent>=20)amb*=1.7;
      if(f.kin&&f.resent<20)amb=0.015;
      if(f.ally)amb=0;
      var fl=dynFloat(G);
      if(fl>0.012&&f.sh<0.62&&Math.random()<amb){
        var buy=Math.min(fl,0.045,f.cash*0.8/(co.mc*1.05));buy*=0.5+0.5*Math.random();
        if(buy>=0.004){f.cash-=buy*co.mc*1.05;f.sh+=buy;co.mc*=1+0.35*buy}
      }
      if(f.sh>=0.05&&!f.disc){f.disc=true;dynNews(G,co.sec,f.name+' trở thành cổ đông lớn của "'+co.name+'" (nắm '+Math.round(f.sh*100)+'%, phải công bố theo Điều 127 Luật Chứng khoán 2019).',1)}
      else if(f.sh<0.04&&f.disc)f.disc=false;
      var mi=dynMarkOf(f.sh);
      if(mi>f.mark){f.mark=mi;if(!f.ally&&!given&&G.q-f.tq>=4){given=true;f.tq=G.q;evs.push(evTender(G,f,DYN_MARKS[mi-1]))}}
      else if(mi<f.mark)f.mark=mi;
    }
    /* chuyển giao thế hệ của gia tộc */
    if(f.age>=f.life)dynSucceed(G,f);
  });
  if(co&&!given){
    top=dynTop(G);var C=dynCtrl(G);
    if(top&&top.sh>C+0.02&&top.sh>=0.28&&G.q-D.lastEgm>=6&&Math.random()<0.35){D.lastEgm=G.q;evs.push(evEgm(G,top))}
    else if(top&&top.sh>=0.18&&top.sh<0.25&&!top.warned){top.warned=true;dynNews(G,co.sec,top.name+' đã gom '+Math.round(top.sh*100)+'% cổ phiếu "'+co.name+'", sắp chạm mốc 25% phải chào mua công khai (Điều 35 Luật Chứng khoán 2019).',1)}
    if(top&&top.sh<0.15)top.warned=false;
  }
}
function dynSucceed(G,f){
  var fac=rnd(0.6,1.25);f.cash*=fac;f.assets*=fac;f.gen++;f.age=0;f.life=ri(90,112);
  if(f.kin){f.resent*=0.5;if(f.gen>=3){f.kin=false;f.rel='họ hàng xa'}}
  var co=dynCo(G),sold=0;
  if(co&&f.sh>0.04&&Math.random()<0.3){sold=f.sh*0.4;f.sh-=sold;f.cash+=sold*co.mc*0.98}
  dynNews(G,f.sec,f.name+' chuyển giao sang thế hệ '+f.gen+', người nối nghiệp '+(fac>1?'làm ăn khéo hơn':'kém hơn')+' đời trước'+(sold>0?' và bán bớt cổ phiếu "'+co.name+'"':'')+'.',0);
}

/* ---------- công ty đối thủ phá sản: mua tài sản ---------- */
function dynOnBotDeath(G,sec,b,evs){
  var D=G.dyn;if(!D||!D.fams.length)return;
  if(b.fam){var f0=dynFamByBot(G,b);if(f0){f0.bid=0;f0.fallen=G.q;dynNews(G,sec,f0.name+' mất công ty '+b.name+' vì vỡ nợ.',0)}}
  var val=Math.round(coUpCost(G,b.lvl)*0.9);
  var cands=D.fams.filter(function(f){return !f.dead&&f.id!==b.fam&&f.cash>val*0.6}).sort(function(a,c){return (c.sec===sec?1e9:0)+c.cash-((a.sec===sec?1e9:0)+a.cash)});
  var co=G.co&&!G.co.closed?G.co:null;
  if(co&&co.sec===sec&&co.lvl<CO_MAXLV&&evs&&Math.random()<0.55){evs.push(evAuction(G,b,val,cands[0]||null));return}
  if(cands.length&&Math.random()<0.8)dynTakeAssets(G,cands[0],val,sec,b);
}
function dynTakeAssets(G,f,val,sec,b){
  var price=val*0.55,mx=botMaxLvl(G),fb=dynBot(G,f);
  f.cash-=price;f.wins++;
  if(fb&&f.sec===sec&&fb.lvl<mx){fb.lvl++;dynNews(G,sec,f.name+' mua tài sản của '+b.name+' ở phiên thanh lý, công ty '+fb.name+' lên cấp '+fb.lvl+'.',0)}
  else{f.assets+=val*0.9/G.infl;dynNews(G,sec,f.name+' mua nhà xưởng, thiết bị của '+b.name+' ở phiên thanh lý với giá '+Math.round(price).toLocaleString('vi-VN')+' triệu.',0)}
}
function evAuction(G,b,val,rival){
  var co=G.co,sec=co.sec,p1=Math.round(val*0.55),p2=Math.round(val*0.75),w1=rival?0.4:0.85,w2=rival?0.7:0.97;
  function bid(price,w){return function(G){
    if(co.lvl>=CO_MAXLV)return 'Doanh nghiệp đã đạt quy mô tối đa.';
    var dep=Math.round(price*0.05);
    if(!coFund(G,dep))return 'Không đủ tiền đặt cọc.';
    if(Math.random()<w){
      var rest=price-dep;
      if(!coFund(G,rest)){co.cash+=dep;return 'Trúng giá nhưng không đủ tiền thanh toán, mất tiền cọc '+dep+' triệu.'}
      co.lvl++;dynNews(G,sec,'"'+co.name+'" trúng phiên thanh lý tài sản của '+b.name+', lên cấp '+co.lvl+'.',1);G.fx.push({k:'ach',txt:'Mua tài sản đối thủ'});
      return 'Trúng phiên thanh lý: nhà xưởng, thiết bị, hợp đồng của '+b.name+' về tay công ty mày, lên cấp '+co.lvl+'.';
    }
    if(rival)dynTakeAssets(G,rival,val,sec,b);
    return 'Thua phiên thanh lý'+(rival?', '+rival.name+' mua được':'')+'. Mất tiền cọc '+dep+' triệu.';
  }}

    {label:'Trả giá khởi điểm ('+p1.toLocaleString('vi-VN')+' triệu, cọc 5%)',hint:'Trúng khoảng '+Math.round(w1*100)+'%: công ty lên 1 cấp. Trượt: mất tiền cọc',do:bid(p1,w1)},
    {label:'Trả cao hơn ('+p2.toLocaleString('vi-VN')+' triệu, cọc 5%)',hint:'Trúng khoảng '+Math.round(w2*100)+'%, tốn nhiều hơn',do:bid(p2,w2)},
    {label:'Bỏ qua',hint:'Không đổi',do:function(G){if(rival)dynTakeAssets(G,rival,val,sec,b);return 'Mày không tham gia phiên thanh lý.'}}]);
}

function dynLoseCo(G,f,price,how){
  var co=G.co;if(!co)return;
  G.cash+=Math.round(price);
  var b=dynBot(G,f),lv=Math.max(1,Math.min(CO_MAXLV,co.lvl)),sec=co.sec;
  if(b&&f.sec===sec){b.lvl=Math.max(b.lvl,lv)}
  else if(G.mkt&&G.mkt[sec]){var nb=mkBot(G,sec,f.style==='safe'?'safe':'aggr',lv);nb.fam=f.id;nb.name=co.name+' (thuộc '+f.name+')';G.mkt[sec].bots.push(nb);if(!b)f.bid=nb.id}
  f.sh=0;f.cash=Math.max(f.cash-price,-price*0.3);
  G.dyn.lost.push({q:G.q,name:co.name,by:f.name});
  G.fx.push({k:'ach',txt:'Mất công ty vào tay '+f.name,bad:true});
  mem(G,'co','công ty tôi gây dựng rơi vào tay '+f.name+' sau cuộc giành quyền kiểm soát',3);
  logm(G,'"'+co.name+'" rơi vào tay '+f.name+' ('+how+'). Mày nhận '+Math.round(price).toLocaleString('vi-VN')+' triệu cho phần cổ phiếu của mày.','bad');
  G.co=null;G.dyn.coKey='';
}
function dynGuard(G){var co=dynCo(G);return co?'':'Công ty chưa niêm yết.'}
function evTender(G,f,mark){
  var co=G.co,price=Math.round(co.eq*co.mc*1.15),mk=Math.round(mark*100),buyPct=0.05;
  var shTxt=Math.round(f.sh*1000)/10;
  var ch=[];
  ch.push({label:'Chấp nhận bán toàn bộ phần của mày ('+price.toLocaleString('vi-VN')+' triệu, cao hơn vốn hóa 15%)',hint:'Mày mất công ty vào tay '+f.name,do:function(G){dynLoseCo(G,f,price,'chấp nhận chào mua công khai');return 'Mày bán hết cổ phần cho '+f.name+' và rời công ty.'}});
  ch.push({label:'Mua gom thêm 5% từ thị trường ('+Math.round(buyPct*co.mc*1.1).toLocaleString('vi-VN')+' triệu)',hint:'Chỉ mua được nếu còn đủ cổ phiếu tự do; đẩy giá lên',do:function(G){return dynBuy(G,buyPct)||'Mày mua gom thêm cổ phiếu, giữ vững quyền chi phối trước mắt.'}});
  ch.push({label:'Phát hành riêng lẻ 15% cho nhà đầu tư chiến lược',hint:'Công ty huy động ~'+Math.round(0.15*co.mc*0.9).toLocaleString('vi-VN')+' triệu, mày bị pha loãng nhưng có đồng minh giữ cổ phiếu',do:function(G){
    if(co.eq*0.85<0.2)return 'Pha loãng thêm sẽ làm mày mất quyền chi phối.';
    var raise=Math.round(0.15*co.mc*0.9);co.cash+=raise;dynDilute(G,0.15);co.allied=(co.allied||0)+0.15;logm(G,'Nhà đầu tư chiến lược mua 15% cổ phần phát hành riêng lẻ, đứng về phía ban điều hành.','news');return 'Nhà đầu tư chiến lược nhận 15%, công ty có thêm '+raise.toLocaleString('vi-VN')+' triệu. Mày còn '+Math.round(co.eq*100)+'%.'}});
  if(f.kin&&f.resent<70)ch.push({label:'Ngồi lại thương lượng với '+f.name+' ('+K(G,150).toLocaleString('vi-VN')+' triệu "quà làm lành")',hint:'Khoảng 50% họ đồng ý đứng về phía mày; không thì hằn học hơn',do:function(G){
    if(G.cash<K(G,150))return 'Không đủ tiền.';G.cash-=K(G,150);
    if(Math.random()<0.55-f.resent/250){f.ally=true;f.resent=Math.max(0,f.resent-25);return 'Gia đình nói chuyện được với nhau: '+f.name+' đồng ý đứng về phía mày, cổ phần của họ tính vào phe kiểm soát.'}
    f.resent=clamp(f.resent+8,0,100);return 'Thương lượng đổ vỡ, '+f.name+' càng quyết tâm hơn.'}});
  ch.push({label:'Bỏ qua, để cổ đông tự quyết',hint:'Giữ nguyên hiện trạng',do:function(G){return 'Mày không phản ứng gì với đợt chào mua.'}});
  return mkEv('tender',f.name+' chào mua công khai cổ phiếu "'+co.name+'"',f.name+' vừa mua vượt mốc '+mk+'% cổ phiếu có quyền biểu quyết (hiện '+shTxt+'%). Theo Điều 35 Luật Chứng khoán 2019, người mua để đạt từ 25% trở lên, rồi tiếp tục ở các mốc 35%, 45%, 55%..., phải chào mua công khai tới mọi cổ đông. Giá chào mua trong game là vốn hóa +15% (tạm tính). Mày đang nắm '+Math.round(co.eq*100)+'%'+((co.allied||0)>0?', phe đồng minh '+Math.round(co.allied*100)+'%':'')+'. Mày làm gì?',ch);
}
function evEgm(G,f){
  var co=G.co,price=Math.round(co.eq*co.mc*0.95),nowSh=Math.round(f.sh*100);
  return mkEv('egm','Đại hội cổ đông bất thường tại "'+co.name+'"',f.name+' nắm '+nowSh+'% so với phe của mày '+Math.round(dynCtrl(G)*100)+'% và triệu tập đại hội bất thường để thay Hội đồng quản trị. Theo Điều 148 Luật Doanh nghiệp 2020, nghị quyết thường được thông qua khi trên 50% tổng số phiếu của cổ đông dự họp tán thành; vấn đề quan trọng như thay đổi cơ cấu quản lý, tổ chức lại cần từ 65%. Cổ đông nhỏ nghiêng về bên nắm nhiều cổ phiếu hơn.',[
    {label:'Thoái vốn có trật tự ('+price.toLocaleString('vi-VN')+' triệu, 95% vốn hóa)',hint:'Mày rời công ty trong yên ổn',do:function(G){dynLoseCo(G,f,price,'thoái vốn trước đại hội cổ đông');return 'Mày thỏa thuận chuyển nhượng toàn bộ cổ phần cho '+f.name+'.'}},
    {label:'Mua gom khẩn cấp 6% ('+Math.round(0.06*co.mc*1.1).toLocaleString('vi-VN')+' triệu)',hint:'Chỉ có ý nghĩa nếu đẩy phe mày vượt phe đối phương',do:function(G){
      var m=dynBuy(G,0.06);if(m)return m;
      if(dynCtrl(G)>=f.sh)return 'Mày mua đủ cổ phiếu để phe mình dẫn lại, đại hội không thông qua nghị quyết thay HĐQT.';
      var pr=Math.round(co.eq*co.mc*0.9);dynLoseCo(G,f,pr,'thua ở đại hội cổ đông');return 'Vẫn thua phiếu. '+f.name+' thay Hội đồng quản trị, mày bán lại cổ phần.'}},
    {label:'Kiện yêu cầu hủy nghị quyết ('+K(G,120).toLocaleString('vi-VN')+' triệu án phí, luật sư)',hint:'Khoảng 25% thắng và hoãn được 8 quý; thua thì mất công ty',do:function(G){
      if(G.cash<K(G,120))return 'Không đủ tiền theo vụ kiện.';G.cash-=K(G,120);
      if(Math.random()<0.25){G.dyn.lastEgm=G.q+8;return 'Tòa tạm đình chỉ nghị quyết của đại hội: mày có thêm 8 quý để củng cố lại.'}
      var pr=Math.round(co.eq*co.mc*0.85);dynLoseCo(G,f,pr,'thua kiện sau đại hội cổ đông');return 'Vụ kiện thất bại, mày rời công ty.'}}]);
}
function dynDilute(G,x){
  if(!G.dyn)return;G.dyn.fams.forEach(function(f){f.sh*=(1-x)});
  if(G.co)G.co.eq*=(1-x);
}
function dynBuy(G,pct){
  var co=dynCo(G);if(!co)return 'Công ty chưa niêm yết.';if(G.P.jail>0)return 'Mày đang thụ án.';
  var fl=dynFloat(G);if(fl<0.004)return 'Gần như không còn cổ phiếu tự do để mua.';
  pct=Math.min(pct,fl);var cost=Math.round(pct*co.mc*1.1);
  if(G.cash<cost)return 'Không đủ tiền ('+cost.toLocaleString('vi-VN')+' triệu).';
  G.cash-=cost;co.eq+=pct;co.mc*=1+0.35*pct;
  logm(G,'Mày mua gom '+(pct*100).toFixed(1).replace('.',',')+'% cổ phiếu công ty, chi '+cost.toLocaleString('vi-VN')+' triệu. Mày nắm '+Math.round(co.eq*100)+'%.','news');return '';
}
function dynPeace(G,id){
  var f=G.dyn.fams.filter(function(x){return x.id===id})[0];if(!f||!f.kin)return 'Không tìm thấy.';
  if(G.q-f.peace<8)return 'Mới hòa giải gần đây, chờ thêm vài quý.';
  var c=K(G,80);if(G.cash<c)return 'Không đủ tiền ('+c+' triệu).';
  G.cash-=c;f.peace=G.q;f.resent=Math.max(0,f.resent-22);G.P.happy=clamp(G.P.happy+3,0,100);
  logm(G,'Mày mời '+f.name+' ăn bữa cơm đoàn tụ, chi '+c+' triệu: tình cảm anh chị em khá lên.','good');return '';
}
function dynAlly(G,id){
  var f=G.dyn.fams.filter(function(x){return x.id===id})[0];if(!f||!f.kin)return 'Không tìm thấy.';
  if(f.ally){f.ally=false;logm(G,f.name+' rút khỏi liên minh với mày.','news');return ''}
  if(f.resent>=40)return f.name+' còn giận (hằn học '+Math.round(f.resent)+'/100), chưa chịu đứng về phía mày. Hòa giải trước.';
  f.ally=true;logm(G,f.name+' đồng ý đứng về phía mày: cổ phần của họ tính vào phe kiểm soát và họ ngừng gom thêm.','good');return '';
}
function dynAch(){

}

   Mọi chi phí, hệ số, xác suất là số liệu mô phỏng của trò chơi, tạm tính.

var HER_T={
  park:{name:'Công viên',cost:400,lv:1,pts:4},
  culture:{name:'Nhà văn hóa',cost:700,lv:2,pts:6},
  edu:{name:'Trường học',cost:900,lv:2,pts:8},
  hosp:{name:'Bệnh viện',cost:1400,lv:2,pts:10}
};
var HER_MAX=8;
function legInit(G){if(!G.leg)G.leg={fame:0,terms:0,scand:0,seat:false,termLeft:0,ip:0,coi:0,acts:0,lastRun:-99};return G.leg}
function houseName(G){return (G.gens&&G.gens.length?G.gens[0].name:(G.P.name||'Tao'))}
function heritageList(G){var o=[];G.T.forEach(function(t,i){if(t.her)o.push(i)});return o}
function heritagePts(G){var s=0;G.T.forEach(function(t){if(t.her&&HER_T[t.t])s+=HER_T[t.t].pts});return s}
function heritageCost(G,type){return K(G,HER_T[type].cost)}
function heritageBuild(G,i,type){
  var t=G.T[i],H=HER_T[type];legInit(G);
  if(!H)return 'Loại công trình không hợp lệ.';if(G.P.jail>0)return 'Mày đang thụ án.';
  if(!t||!t.own||t.t!=='empty'||t.proj)return 'Cần một ô đất trống của mày để xây công trình.';
  if(t.qh)return 'Ô đất thuộc khối quy hoạch, chưa dùng được.';
  if(heritageList(G).length>=HER_MAX)return 'Gia tộc đã có '+HER_MAX+' công trình di sản, đủ rồi.';
  var c=heritageCost(G,type);if(G.cash<c)return 'Không đủ tiền (cần '+c.toLocaleString('vi-VN')+' triệu).';
  G.cash-=c;
  var lab=H.name+' '+houseName(G)+(G.gen>1?' (đời '+G.gen+')':'');
  t.t=type;t.lv=H.lv;t.grow=0;t.own=false;t.landPaid=0;t.cost=0;t.prem=1;t.zone=null;t.illegal=false;t.defect=false;t.deed=false;t.big=false;t.zb=false;
  t.her={n:lab,g:G.gen,q:G.q};t.lm=true;t.pname=lab;t.wear=0;t.wsig=type+'|'+H.lv;
  G.leg.fame+=H.pts;G.P.rep=clamp(G.P.rep+3,0,100);G.P.happy=clamp(G.P.happy+2,0,100);
  mem(G,'her','tôi hiến đất, bỏ tiền xây '+lab.toLowerCase()+' tặng thành phố',2.5);
  logm(G,'Mày hiến ô đất và '+c.toLocaleString('vi-VN')+' triệu xây '+lab+'. Công trình thuộc về thành phố và còn mãi sau mày.','good');
  G.fx.push({k:'ach',txt:lab});
  return '';
}

/* ---------- Hội đồng thành phố ---------- */
var CN_ACT={
  infra:{name:'Đề xuất đầu tư hạ tầng',ip:3,desc:'Giá đất của khu tăng thêm khoảng 8% rồi dần trở về nền.'},
  public:{name:'Ưu tiên xây công trình công cộng',ip:2,desc:'Thành phố xây thêm một trường, bệnh viện hoặc công viên trong khu.'},
  fast:{name:'Đẩy nhanh thủ tục dự án',ip:2,desc:'Dự án của mày ở giai đoạn pháp lý hoặc xin phép được rút ngắn 1 quý.'},
  lobby:{name:'Vận động ngầm các đại biểu',ip:0,desc:'Đưa tiền để có thêm 4 điểm ảnh hưởng. Đây là hành vi đưa hối lộ.'}
};
function cnEligible(G){var P=G.P;return age(G)>=30&&!P.record&&P.jail<=0&&P.rep>=50}
function cnOwned(G,d){var n=0;G.T.forEach(function(t){if(t.own&&t.d===d)n++});return n}
function cnWin(G){
  var L=legInit(G),P=G.P;
  return clamp(0.2+0.006*(P.rep-50)+0.02*Math.min(8,heritageList(G).length)+0.002*Math.min(100,L.fame)+(L.terms>0?0.1:0)-0.08*L.scand,0.05,0.85);
}
function cnAct(G,k,d){
  var L=legInit(G),A=CN_ACT[k];if(!A)return 'Không rõ việc này.';
  if(!L.seat)return 'Mày chưa có ghế trong Hội đồng.';if(G.P.jail>0)return 'Mày đang thụ án.';
  if(L.ip<A.ip)return 'Chưa đủ điểm ảnh hưởng (cần '+A.ip+', có '+Math.floor(L.ip)+').';
  var conflict=cnOwned(G,d)>=3;
  if(k==='infra'){
    if(!DIST[d]||!distOpen(G,d))return 'Chọn một khu đã mở.';
    var c=K(G,60);if(G.cash<c)return 'Không đủ tiền chi phí vận động chính sách ('+c+' triệu).';
    G.cash-=c;L.ip-=A.ip;G.lm[d]=Math.min(1.5,G.lm[d]*1.08);
    if(conflict){L.coi+=1.5;addMark(G,'legal',3)}
    logm(G,'Hội đồng thông qua gói hạ tầng ở '+DIST[d].name+' theo đề xuất của mày: giá đất khu tăng.'+(conflict?' Mày đang giữ nhiều đất ở khu này: đây là xung đột lợi ích, lẽ ra phải báo cáo (Điều 23 Luật Phòng, chống tham nhũng 2018).':''),conflict?'bad':'good');return '';
  }
  if(k==='public'){
    if(!DIST[d]||!distOpen(G,d))return 'Chọn một khu đã mở.';
    var cand=[];G.T.forEach(function(t){if(t.t==='empty'&&!t.own&&!t.proj&&!t.qh&&t.d===d)cand.push(t)});
    if(!cand.length)return 'Khu này hết đất trống do thành phố quản lý.';
    var A2=G.agg,want={edu:1+Math.floor(G.city.pop/3500),hosp:1+Math.floor(G.city.pop/5000),park:Math.max(1,Math.floor(G.city.pop/2500))},best='park',bs=-1;
    ['edu','hosp','park'].forEach(function(ty){var s=(want[ty]-A2.cnt[ty])/want[ty];if(s>bs){bs=s;best=ty}});
    var tt=cand[Math.floor(Math.random()*cand.length)];tt.t=best;tt.lv=best==='park'?1:2;tt.grow=0;L.ip-=A.ip;
    if(conflict){L.coi+=1;}
    logm(G,'Theo đề nghị của mày, thành phố xây thêm '+BLD[best].toLowerCase()+' ở '+DIST[d].name+'.','good');return '';
  }
  if(k==='fast'){
    var pj=G.projs.filter(function(p){return !p.done&&!p.failed&&(p.stage===2||p.stage===3)})[0];
    if(!pj)return 'Không có dự án nào đang ở giai đoạn pháp lý hoặc xin phép.';
    L.ip-=A.ip;pj.dur[pj.stage]=Math.max(pj.sq+1,pj.dur[pj.stage]-1);L.coi+=2;addMark(G,'legal',2);
    logm(G,'Mày dùng ghế Hội đồng để thúc nhanh thủ tục dự án '+pj.name+', rút 1 quý. Người ngoài dễ coi đây là lợi dụng chức vụ, quyền hạn (xung đột lợi ích, Điều 23 Luật Phòng, chống tham nhũng 2018).','news');return '';
  }
  if(k==='lobby'){
    var c2=K(G,100);if(G.cash<c2)return 'Không đủ tiền ('+c2+' triệu).';
    G.cash-=c2;L.ip=Math.min(12,L.ip+4);addMark(G,'legal',10);crimeNote(G,'give',c2);

  }

}

function legStep(G,evs){
  var L=legInit(G),hc=heritageList(G).length,enf=G.flags.anticorr>0?2.2:1;

    if(G.P.jail>0){L.seat=false;L.ip=0}
    else if(Math.random()<risk){
      L.seat=false;L.ip=0;L.scand++;var fine=K(G,60)+Math.round(0.002*Math.max(0,netWorth(G)));G.cash-=fine;

    }
  }
  if(!L.seat&&G.q>=10&&G.q%20===10&&cnEligible(G)&&G.q-L.lastRun>=10){L.lastRun=G.q;evs.push(evElection(G))}
}

/* ---------- điểm gia tộc ---------- */
function dynScore(G){
  var L=legInit(G),hp=heritagePts(G),nw=netWorth(G)/G.infl,wsc=clamp(100*Math.log(1+Math.max(0,nw)/200)/Math.log(1+30000/200),0,100);
  var kin=G.dyn?G.dyn.fams.filter(function(f){return f.kin&&!f.dead}):[];
  var har=kin.length?kin.reduce(function(a,f){return a+(100-f.resent)},0)/kin.length/100*10:6;
  var s={heritage:Math.min(35,hp),gens:Math.min(20,G.gen>1?6*(G.gen-1)+2:0),council:Math.min(15,5*L.terms),wealth:wsc*0.2,harmony:har};
  var pen=L.scand*5+((G.stats&&G.stats.jail)>0?5:0)+(G.dyn&&G.dyn.lost?4*G.dyn.lost.length:0);
  var tot=clamp(s.heritage+s.gens+s.council+s.wealth+s.harmony-pen,0,100);
  return {s:s,pen:pen,total:tot};
}

/* ===== MỤC 4: CHẾ ĐỘ QUẢN GIA =====
   Người chơi đặt luật (quỹ dự phòng, đầu tư phần dư, mở rộng, cải tạo, phòng thủ cổ phần...).
   Game chạy nhiều quý liền, mỗi quý quản gia làm theo luật rồi xử lý các sự kiện nhỏ theo bảng chính sách;
   gặp quyết định lớn (điều tra, thâu tóm, chào mua công khai, IPO, cưới hỏi...) thì dừng và trả lại cho người chơi. */
var STEW_RES=[2,4,8];                       /* số quý sinh hoạt giữ làm quỹ dự phòng */
var STEW_RES_NAME=['Mỏng (2 quý sinh hoạt)','Vừa (4 quý)','Dày (8 quý)'];
var STEW_INV_NAME=['Không đầu tư','Thận trọng: tiết kiệm, vàng','Cân bằng: thêm chứng khoán, trái phiếu','Mạo hiểm: nhiều chứng khoán, có tiền số'];
var STEW_SAT_NAME=['Không','20% phần dư','40% phần dư'];
var STEW_SAT_SH=[0,0.2,0.4];
var STEW_INV_MIX=[null,{tk:0.7,vang:0.3},{tk:0.35,vang:0.2,ck:0.35,tp:0.1},{tk:0.15,vang:0.1,ck:0.55,tp:0.1,tien:0.1}];

function stewInit(G){
  if(!G.stew)G.stew={res:1,inv:1,exp:true,repay:true,reno:true,build:1,land:1,defend:true,council:false,opp:1,fam:1,sat:1,rest:true,runs:0,last:null};
  if(G.stew.fam===undefined)G.stew.fam=1;
  if(G.stew.sat===undefined||G.stew.sat===true)G.stew.sat=1;if(G.stew.sat===false)G.stew.sat=0;
  return G.stew;
}
function stewReserve(G){
  var S=stewInit(G);
  return livingQ(G)*STEW_RES[clamp(S.res,0,2)]+G.debt*G.mort/4*2;
}

/* ---------- chính sách xử lý sự kiện ----------
   trả về chỉ số lựa chọn, hoặc -1 nếu là quyết định lớn cần người chơi */
var STEW_TAKE={era_open:1,quynhan:1,hoplop:1,benh:1,trungqh:1,pe_vdv:1,pe_ns:1,pe_bh:1};
var STEW_DECLINE={goivon:1,scamdat:1,traiphieu:1,tinqh:1,pe_tc:1,pe_ls:1,pe_nong:1,pe_cn:1,pe_xd:1,pe_kt:1,pe_cc:1,pe_gv:1,pe_bs:1,pe_it:1,pe_ks:1};
var STEW_SMALL={daugia:1};
var STEW_OPP={daugiakhoi:1,mna:1,thaumbot:1,qhauction:1,qhrebid:1,auction:1,ipo:1,fund:1};
var STEW_DECLINE_RE=/^(Từ chối|Bỏ qua|Ở lại|Giữ im|Tiếp tục làm riêng|Tập trung|Nhường|Hoãn|Không|Cứ bán|Xin|Tiết kiệm)/;
function stewByLabel(ev,re){for(var i=0;i<ev.choices.length;i++)if(re.test(ev.choices[i].label))return i;return -1}
function stewPick(G,ev){
  var S=stewInit(G),id=ev.id,R=stewReserve(G),n=ev.choices.length,i;
  if(id==='tet')return G.cash>R*1.5?0:1;
  if(id==='sat_shock')return G.cash>R*1.2?0:1;
  if(id==='khamsk')return G.cash>R?0:1;
  if(id==='hohang')return G.cash>R*2?0:1;
  if(id==='sandau')return age(G)<55?0:1;
  if(id==='era_warn')return G.cash>R*2?1:0;
  if(id==='bau_cu')return S.council?0:1;
  if(id==='pe_ks')return (G.P.health>=60)?0:1;
  if(id==='pe_bh'){i=stewByLabel(ev,/^Xung phong/);return i>=0?i:-1}
  if(STEW_TAKE[id])return 0;
  if(STEW_DECLINE[id]){
    i=stewByLabel(ev,STEW_DECLINE_RE);
    if(i<0&&id==='pe_it')i=stewByLabel(ev,/Ở lại/);
    return i; /* -1 nếu không nhận ra nhãn: dừng cho chắc */
  }
  if(STEW_SMALL[id]){            /* phát mãi đất rẻ hơn 30%: tự nhận nếu còn dư sau quỹ dự phòng */
    if(S.opp>=2)return -1;
    if(S.opp===1){
      var mm=/\(([\d.,]+) triệu/.exec(ev.choices[0].label),cost=mm?parseInt(mm[1].replace(/[.,]/g,''),10):1e12;
      if(S.land>0&&G.cash-cost>R*1.2)return 0;
    }
    return stewByLabel(ev,/^Bỏ qua/);
  }
  if(id==='cuoihoi'||id==='concai'){
    if(S.fam)return -1;
    return stewByLabel(ev,/^(Chưa vội|Hoãn)/);
  }
  if(STEW_OPP[id]){
    if(S.opp>=1)return -1;                 /* cơ hội: hỏi người chơi */
    i=stewByLabel(ev,/^(Bỏ qua|Không tham gia|Từ chối|Hoãn)/);return i; /* bỏ qua */
  }
  return -1;                                 /* điều tra, thanh tra, lỗi công trình, chào mua, đại hội, cưới hỏi, con cái, giải nghệ, không rõ */
}
var STEW_BIG_NAME={dieutra:'Cơ quan điều tra',thanhtra:'Thanh tra',defect:'Công trình có lỗi',tender:'Chào mua công khai',egm:'Đại hội cổ đông',giainghe:'Giải nghệ',concai:'Chuyện con cái',cuoihoi:'Chuyện lập gia đình',qhgiahan:'Quy hoạch chưa khởi công',breakout:'Sản phẩm đột phá',ipo:'IPO',fund:'Quỹ đầu tư',mna:'Thâu tóm',thaumbot:'Thâu tóm đối thủ yếu',auction:'Thanh lý tài sản',qhauction:'Đấu giá quy hoạch',qhrebid:'Đất quy hoạch được giao lại',daugia:'Phát mãi đất',daugiakhoi:'Đấu giá quỹ đất',tinquyhoach:'Tin quy hoạch',bau_cu:'Bầu cử Hội đồng'};

/* ---------- hành động mỗi quý ---------- */
function stewSell(G,need,A){
  var ord=['tk','vang','tp','ck','tien'],got=0;
  for(var j=0;j<ord.length&&got<need;j++){
    var k=ord[j],v=finValue(G,k);if(v<1)continue;
    var a=Math.min(v,need-got);if(sellFin(G,k,a)==='')got+=a;
  }
  if(got>0){A.sold+=got}
  return got;
}
function stewBestBuild(G,t){
  var best=null,sv={t:t.t,lv:t.lv,grow:t.grow,cost:t.cost},types=['res','com','office','ind','farm','hotel','edu','hosp','culture','sport','fun'];
  for(var j=0;j<types.length;j++){
    var ty=types[j],c=buildCost(G,ty,1);
    t.t=ty;t.lv=1;t.grow=1;t.cost=c;
    var inc=plotIncome(G,t);
    t.t=sv.t;t.lv=sv.lv;t.grow=sv.grow;t.cost=sv.cost;
    var r=inc/c;
    if(!best||r>best.r)best={ty:ty,c:c,r:r};
  }
  return best;
}
function stewSatBest(G){
  var bst=null;
  SAT_IDS.forEach(function(id){
    var c=G.sat[id];if(!c.open||c.assets.length>=satMaxAssets(c))return;
    for(var kk in SAT[id].kinds){
      var kd=SAT[id].kinds[kk];if(kd.y<0.01)continue;     /* đất dự trữ thuần đầu cơ: quản gia bỏ qua */
      var pr=satBuyPrice(G,c,kk,1),sc=kd.y*c.D*satSat(c)*(1+0.05*c.infra)/Math.pow(c.L,kd.be)*(1-0.4*clamp(c.heat,0,1));
      if(!bst||sc>bst.sc)bst={id:id,k:kk,pr:pr,sc:sc};
    }
  });
  return bst&&bst.sc*4>=0.055?bst:null;
}
function stewApply(G,A){
  var S=stewInit(G);if(G.P.jail>0||G.over)return;
  var R=stewReserve(G),i,t,m;
  /* 1. thanh khoản: thiếu tiền thì bán tài chính trước khi bị vay nóng */
  if(G.cash<R*0.8){var fin=finTotal(G);if(fin>1)stewSell(G,Math.min(fin,R*0.8-G.cash),A)}
  /* 2. sức khỏe */
  if(S.rest&&G.P.health<48){var pu=pointsUsed(G);if(pu.used<pu.total&&!G.plan.nghi){G.plan.nghi=1;A.rest++}}
  /* 3. trả nợ */
  if(S.repay&&G.debt>1&&G.cash>R*1.3){var a=Math.min(G.debt,G.cash-R*1.3);if(a>=1&&repayDebt(G,a)===''){A.repay+=a}}
  /* ngân sách dành cho vùng vệ tinh: giữ lại khỏi các bước ở nhà */
  var R0=R,satHold=0,satBst=null;
  if(S.sat>0&&G.sat&&satOpenAny(G)&&satValue(G)<0.4*netWorth(G)&&(satBst=stewSatBest(G))){
    S.pot=Math.min(Math.max(0,G.cash-R*1.5),(S.pot||0)+STEW_SAT_SH[clamp(S.sat,0,2)]*Math.max(0,G.cash-R*1.5-(S.pot||0)));
    satHold=S.pot;R=R0+satHold;
  }else S.pot=0;
  /* 4. phòng thủ cổ phần công ty niêm yết */
  if(S.defend){
    var co=dynCo(G),top=co?dynTop(G):null;
    if(co&&top&&top.sh>=0.15&&dynCtrl(G)<top.sh+0.08&&dynFloat(G)>0.01){
      var pct=Math.min(0.05,dynFloat(G)),cost=pct*co.mc*1.1;
      if(G.cash-cost>R*0.5&&dynBuy(G,pct)===''){A.defend+=cost;A.defendN++}
    }
  }
  /* 5. cải tạo công trình xuống cấp */
  if(S.reno){var ri=renoAllInfo(G,0.7);if(ri.n>0&&G.cash-ri.c>R){if(renovateAll(G,0.7)===''){A.reno+=ri.c;A.renoN+=ri.n}}}
  /* 6. mở rộng doanh nghiệp */
  if(S.exp&&G.co&&!G.co.closed&&G.co.lvl<CO_MAXLV&&!(G.co.ipoPrep>0)){
    var need=coUpCost(G,G.co.lvl),fromCo=Math.min(Math.max(0,G.co.cash),need),rest=need-fromCo;
    if(G.cash-rest>R&&coUpgrade(G)===''){A.exp+=need;A.expN++}
  }
  /* 7. xây trên đất trống đã sở hữu (tối đa 2 ô mỗi quý) */
  if(S.build>0){
    var nb=0;
    for(i=0;i<G.T.length&&nb<2;i++){
      t=G.T[i];if(!t.own||t.t!=='empty'||t.proj||t.qh||t.her)continue;
      var b=stewBestBuild(G,t);
      if(b&&b.r>=0.012&&G.cash-b.c>R&&buildOn(G,i,b.ty)===''){A.build+=b.c;A.buildN++;nb++}
    }
  }
  /* 8. mua thêm đất (tùy chọn): ô rẻ nhất ở khu đang tăng giá, chỉ khi không còn đất trống của mình */
  if(S.land>0){
    var spare=0;G.T.forEach(function(x){if(x.own&&x.t==='empty'&&!x.proj&&!x.qh)spare++});
    if(spare===0){
      var bi=-1,bs=-1e9;
      for(i=0;i<G.T.length;i++){
        t=G.T[i];if(t.t!=='empty'||t.own||t.qh||t.proj||t.her||t.d==='dt')continue;
        var h=G.hist.land[t.d]||[],tr=h.length>8?h[h.length-1]/h[h.length-9]:1,pr=plotPrice(G,t),sc=tr*100-pr/(G.infl*40);
        if(G.cash-pr>R*1.5+buildCost(G,'res',1)&&sc>bs){bs=sc;bi=i}
      }
      if(bi>=0){var pp=plotPrice(G,G.T[bi]);if(buyPlot(G,bi)===''){A.land+=pp;A.landN++}}
    }
  }
  /* 8b. liên vùng: bảo hiểm, hạ tầng, rồi mua tài sản bằng ngân sách đã giữ lại */
  R=R0;
  if(S.sat>0&&G.sat&&satOpenAny(G)){
    SAT_IDS.forEach(function(id){
      var c=G.sat[id];if(!c.open)return;
      if(!c.ins&&c.assets.length>=2&&G.cash>R*2&&satSupply(c)>=1200){if(satToggleIns(G,id)==='')A.ins++}
      var ip=satInfraPrice(G,c);
      if(c.assets.length>=satMaxAssets(c)-1&&c.infra<3&&G.cash-ip>R*2&&satInfra(G,id)===''){A.sat+=ip;A.satInfra++}
    });
    if(satBst){
      var bst=stewSatBest(G);   /* tính lại sau khi các bước ở nhà đã đổi tiền */
      if(bst&&G.cash-bst.pr>R*1.5&&satBuild(G,bst.id,bst.k)===''){A.sat+=bst.pr;A.satN++;S.pot=Math.max(0,(S.pot||0)-bst.pr)}
    }
  }
  /* 9. đầu tư phần dư theo khẩu vị */
  if(S.inv>0&&G.debt<1){
    var sur=G.cash-R*1.5-(S.pot||0),mix=STEW_INV_MIX[clamp(S.inv,0,3)];
    if(mix&&sur>livingQ(G)){
      for(var k in mix){var amt=Math.floor(sur*mix[k]);if(amt>=1&&buyFin(G,k,amt)==='')A.inv+=amt}
    }
  }
}

/* ---------- vòng chạy ---------- */
var STEW_NOTABLE=/thăng chức|mất việc|thừa kế|chào mua|đại hội|thâu tóm|phá sản|niêm yết|lên cấp|thu hồi|quy hoạch|tù|điều tra|vỡ nợ|cải tạo|hết sạch nợ|thời đại|đắc cử|bãi nhiệm|di sản|mua gom|liên minh|giải thể|cưỡng chế|kỷ lục|lương hưu|nâng cấp|xây |bán nhà|thua|trúng/i;
function stewSnap(G){
  var own=0,built=0;G.T.forEach(function(t){if(t.own){own++;if(t.t!=='empty')built++}});
  return {q:G.q,age:age(G),nw:netWorth(G),cash:G.cash,debt:G.debt,fin:finTotal(G),own:own,built:built,pop:G.city.pop,
    co:G.co&&!G.co.closed?(G.co.listed?coStakeValue(G):coVal(G)):0,rep:G.P.rep,health:G.P.health};
}
function stewardRun(G,maxQ){
  var S=stewInit(G),s0=stewSnap(G);
  var A={sold:0,rest:0,repay:0,defend:0,defendN:0,reno:0,renoN:0,exp:0,expN:0,build:0,buildN:0,land:0,landN:0,inv:0,sat:0,satN:0,satInfra:0,ins:0};
  var notes=[],auto=[],pending=[],stop=null,n=0,seen={};
  var debt0=G.debt;
  while(n<maxQ){
    if(G.over){stop={k:'over',t:G.endKind==='soNo'?'Vỡ nợ: ván chơi dừng.':'Đã đến tuổi nghỉ hưu: chia di sản, sang thế hệ kế tiếp.'};break}
    stewApply(G,A);
    var head=G.log[0],r=endQuarter(G);n++;
    /* gom các dòng nhật ký đáng nhớ phát sinh trong quý */
    for(var li=0;li<G.log.length;li++){
      var L=G.log[li];if(L===head)break;
      if((L.k==='good'||L.k==='bad'||L.k==='news')&&STEW_NOTABLE.test(L.t)&&!seen[L.t]){seen[L.t]=1;notes.push({q:G.q,age:age(G),t:L.t,k:L.k})}
    }
    var evs=r.events||[];
    for(var e=0;e<evs.length;e++){
      var ev=evs[e],idx=G.over?-1:stewPick(G,ev);
      if(idx<0||idx>=ev.choices.length){
        pending=evs.slice(e);
        stop={k:'event',t:'Gặp quyết định cần mày tự chọn: '+(STEW_BIG_NAME[ev.id]||ev.title)+'.'};break;
      }
      var msg=afterChoice(G,ev,idx);
      auto.push({q:G.q,id:ev.id,title:ev.title,pick:ev.choices[idx].label});
      if(msg&&(ev.id==='dieutra'||ev.id==='thanhtra'))notes.push({q:G.q,t:ev.title+': '+msg,k:'bad'});
    }
    if(stop)break;
    if(G.over){stop={k:'over',t:G.endKind==='soNo'?'Vỡ nợ: ván chơi dừng.':'Đã đủ '+(age(G))+' tuổi: đến lúc chia di sản, sang thế hệ kế tiếp.'};break}
    if(G.P.health<25){stop={k:'health',t:'Sức khỏe xuống '+Math.round(G.P.health)+'/100: mày cần tự quyết định có nghỉ ngơi, chữa bệnh không.'};break}
    var rq=stewReserve(G);
    if(G.cash<rq*0.15&&finTotal(G)<livingQ(G)&&G.debt>debt0*1.5+livingQ(G)){stop={k:'cash',t:'Tiền mặt cạn, nợ đang phình ra ('+Math.round(G.debt)+' triệu): mày cần xem lại.'};break}
    if(G.co===null&&s0.co>0&&!seen.coLost){seen.coLost=1;stop={k:'co',t:'Mày không còn doanh nghiệp: xem lại cơ cấu tài sản.'};break}
  }
  if(!stop)stop={k:'done',t:'Chạy đủ '+n+' quý theo kế hoạch.'};
  var s1=stewSnap(G);
  /* chọn tối đa 14 dòng đáng nhớ: ưu tiên chuyện xấu, rồi chuyện tốt, giữ thứ tự thời gian */
  var pick=notes.slice(),max=14;
  if(pick.length>max){
    var bad=pick.filter(function(x){return x.k==='bad'}),oth=pick.filter(function(x){return x.k!=='bad'});
    bad=bad.slice(0,6);oth=oth.slice(0,max-bad.length);pick=bad.concat(oth).sort(function(a,b){return a.q-b.q});
  }
  var sum={n:n,s0:s0,s1:s1,A:A,notes:pick,notesAll:notes.length,auto:auto,stop:stop,debt0:debt0};
  S.runs++;S.last={n:n,q:G.q,nw0:s0.nw,nw1:s1.nw,stop:stop.k};
  return {sum:sum,pending:pending};
}

var SAT_IDS=['cang','dl','nn'];

    law:'Cá nhân nhận chuyển quyền sử dụng đất nông nghiệp không quá 15 lần hạn mức giao đất nông nghiệp (Luật Đất đai 2024, Điều 177 khoản 1, đối chiếu Điều 176). Hạn mức cụ thể do Ủy ban nhân dân tỉnh quy định.',
    kinds:{trangtrai:{n:'Trang trại',b:[250,500,1000],y:0.020,be:0.5},chebien:{n:'Nhà máy chế biến nông sản',b:[700,1400,2800],y:0.025,be:0.6},kholanh:{n:'Kho lạnh và đóng gói',b:[450,900,1800],y:0.020,be:0.6},dat:{n:'Đất vườn đồi',b:[300,600,1200],y:0.0035,be:1.2}},
    era:{urban:0.92,fintech:1.0,ai:1.08,climate:0.55,aging:1.0,metro:0.97}}
};
var SAT_SHOCK={
  cang:[{k:'bao',n:'Bão đổ bộ cảng',p:0.030,mul:0.55,left:2,ev:true},{k:'tac',n:'Tắc nghẽn, đình công ở cảng',p:0.020,mul:0.7,left:2},{k:'cdt',n:'Cảng cạnh tranh ở tỉnh bên mở cửa',p:0.012,mul:0.85,left:8}],
  dl:[{k:'bao',n:'Bão đổ bộ vùng biển',p:0.030,mul:0.5,left:2,ev:true},{k:'ond',n:'Sự cố ô nhiễm biển, tai tiếng',p:0.015,mul:0.7,left:6},{k:'dich',n:'Dịch bệnh lan tới du khách',p:0.0,mul:0.4,left:3}],

};
var SAT_MAXINFRA=5;
var HEATK={cang:1,dl:1.4,nn:0.6};

function satMk(id){
  var d=SAT[id];return {id:id,open:false,pop:d.pop0,pop0:d.pop0,L:1,heat:0,gLast:0.003,infra:0,ins:false,sh:null,D:1,p:1,hist:[1],assets:[],incLast:0,crash:0,peak:1,tot:0,paidOut:0};
}
function satInit(G){
  if(!G.sat)G.sat={};
  SAT_IDS.forEach(function(id){if(!G.sat[id])G.sat[id]=satMk(id)});
  return G.sat;
}
function satOpenAny(G){return !!G.sat&&SAT_IDS.some(function(id){return G.sat[id]&&G.sat[id].open})}
function satCap(c){return SAT[c.id].cap0*(1+0.45*c.infra)*(c.pop/c.pop0)}
function satSupply(c){var s=0;c.assets.forEach(function(a){s+=SAT[c.id].kinds[a.kind].b[a.lv-1]*a.sh});return s}
function satSat(c){var r=satSupply(c)/satCap(c);return 1/(1+0.35*Math.pow(r,1.5))}
function satEra(G,c){
  var E=G.era;if(!E)return 1;var d=SAT[c.id].era,cur=d[E.id]===undefined?1:d[E.id],pr=E.prev?(d[E.prev]===undefined?1:d[E.prev]):cur,b=eraBlend(G);
  return pr+(cur-pr)*b;
}
function satShockEff(c){if(!c.sh||c.sh.left<=0)return 1;return c.ins?1-(1-c.sh.mul)*0.4:c.sh.mul}
function satDemand(G,c){
  var A=G.agg||{cnt:{}},C=G.city,F=G.flags,D=1;
  if(c.id==='cang'){
    var ir=clamp(((A.cnt&&A.cnt.ind)||0)/Math.max(1,C.pop/1800),0.5,1.5);
    D=(0.55+0.45*ir)*(F.boom>0?1.1:1)*(F.recession>0?0.8:1);
  }else if(c.id==='dl'){
    D=clamp(tourIdx(G)/0.9,0.2,1.9);
  }else{
    var fr=clamp(1-(((A.cnt&&A.cnt.farm)||0)/Math.max(1,C.pop/900)),-0.3,0.5);
    D=c.p*(0.92+0.2*fr);
  }
  return clamp(D*satEra(G,c),0.15,2.2);
}
/* ---------- mỗi quý ---------- */
function satStep(G,R,evs){
  satInit(G);
  var home=G.hist&&G.hist.land&&G.hist.land.tt?G.hist.land.tt:[],hm=home.length>=5?home[home.length-1]/home[home.length-5]-1:0;
  var tax=0,gross=0,W=G.satWave||0;
  W=0.9*W+0.04*randn()+(Math.random()<0.035?0.3:0);W=clamp(W,-0.3,0.8);G.satWave=W;
  SAT_IDS.forEach(function(id){
    var c=G.sat[id],d=SAT[id];
    if(id==='nn'){c.p=clamp(Math.exp(0.85*Math.log(c.p)+0.11*randn()),0.5,1.8)}
    if(c.sh&&c.sh.left>0){c.sh.left--;if(c.sh.left<=0){if(c.open)logm(G,d.name+': '+c.sh.n+' đã qua, hoạt động trở lại bình thường.','news');c.sh=null}}
    if(!c.sh&&id==='dl'&&G.flags.epi>0){c.sh={k:'dich',n:'Dịch bệnh lan tới du khách',mul:0.4,left:Math.max(1,G.flags.epi)}}
    var D=satDemand(G,c)*satShockEff(c);c.D=D;
    c.pop=clamp(c.pop*(1+0.003+0.0015*c.infra+0.008*(D-1)),c.pop0*0.6,c.pop0*6);
    var F=Math.pow(c.pop/c.pop0,0.7)*(1+0.08*c.infra);
    c.heat=clamp(0.85*c.heat+0.25*clamp(hm-0.06,-0.05,0.2)+HEATK[id]*(0.35*(c.gLast-0.008)+0.3*W)+0.015*randn(),-0.3,1);
    var g=0.0015+0.03*(Math.log(F)-Math.log(c.L))+0.02*(D-1)+0.05*c.heat+0.014*randn();
    c.L=clamp(c.L*Math.exp(g),0.35,5);c.gLast=g;
    if(c.heat>0.45&&Math.random()<0.07){
      c.L*=0.72;c.heat=-0.25;c.crash++;
      if(c.open)logm(G,'Bong bóng giá đất ở '+d.name+' vỡ: giá đất sụt khoảng 28% trong một quý.','bad');
    }
    if(c.L>c.peak)c.peak=c.L;
    /* cú sốc mới */
    if(!c.sh){
      SAT_SHOCK[id].forEach(function(s){
        if(c.sh||!(s.p>0)||Math.random()>=s.p)return;
        c.sh={k:s.k,n:s.n,mul:s.mul,left:s.left,ev:!!s.ev};
        var base=satSupply(c);
        if(c.open&&c.assets.length&&s.ev&&!c.ins&&G.P.jail<=0){
          evs.push(evSatShock(G,c));
        }else if(c.open){
          logm(G,d.name+': '+s.n+(c.ins&&c.assets.length?' (bảo hiểm giảm thiệt hại)':'')+'.','bad');
        }
      });
    }
    c.hist.push(c.L);if(c.hist.length>60)c.hist.shift();
    /* thu nhập */
    var inc=0;
    if(c.open&&c.assets.length){
      var ea=satEra(G,c),sat=satSat(c),im=1+0.05*c.infra;
      c.assets.forEach(function(a){
        var k=d.kinds[a.kind];
        inc+=K(G,k.b[a.lv-1])*k.y*D*sat*im*a.sh;
      });
      inc*=0.92;  /* phí quản lý từ xa 8% */
      var prem=c.ins?K(G,satSupply(c))*0.004:0;
      inc-=prem;
      if(inc>0){var tx=inc*0.10;tax+=tx;G.stats.tax+=tx;gross+=inc-tx;c.tot+=inc-tx}
      else {gross+=inc;c.tot+=inc}
      c.incLast=inc>0?inc*0.9:inc;
    }else c.incLast=0;
  });
  if(gross!==0){G.cash+=gross;R.sat=(R.sat||0)+gross;R.tax+=tax}
}
function satIncomeQ(G){var s=0;if(!G.sat)return 0;SAT_IDS.forEach(function(id){s+=G.sat[id].incLast||0});return s}
function satPassive(G){return satIncomeQ(G)/3}
/* ---------- giá trị ---------- */
function satAssetVal(G,c,a){var k=SAT[c.id].kinds[a.kind];return K(G,k.b[a.lv-1])*Math.pow(c.L,k.be)*a.sh}
function satCityVal(G,c){var v=0;c.assets.forEach(function(a){v+=satAssetVal(G,c,a)});return v}
function satValue(G){var v=0;if(!G.sat)return 0;SAT_IDS.forEach(function(id){v+=satCityVal(G,G.sat[id])});return v*0.97}
function satBuyPrice(G,c,kind,lv){var k=SAT[c.id].kinds[kind];return K(G,k.b[lv-1])*Math.pow(c.L,k.be)}
function satMaxAssets(c){return 4+2*c.infra}
/* ---------- hành động ---------- */
function satOpen(G,id){
  var c=G.sat[id],d=SAT[id];if(!c)return 'Không có vùng này.';if(c.open)return 'Đã có văn phòng ở đây.';

}
function satBuild(G,id,kind){
  var c=G.sat[id],d=SAT[id];if(!c||!c.open)return 'Chưa mở văn phòng ở vùng này.';if(G.P.jail>0)return 'Mày đang thụ án.';

  var p=satBuyPrice(G,c,kind,1);if(G.cash<p)return 'Không đủ tiền (cần '+p+' triệu).';

function satUpPrice(G,c,a){var k=SAT[c.id].kinds[a.kind];return a.lv>=3?0:Math.round(K(G,k.b[a.lv]-k.b[a.lv-1])*Math.pow(c.L,k.be)*a.sh)}
function satUp(G,id,i){
  var c=G.sat[id],a=c&&c.assets[i];if(!a)return 'Không tìm thấy.';if(G.P.jail>0)return 'Mày đang thụ án.';
  if(a.lv>=3)return 'Đã ở cấp cao nhất.';var p=satUpPrice(G,c,a);if(G.cash<p)return 'Không đủ tiền (cần '+p+' triệu).';
  G.cash-=p;a.lv++;logm(G,'Mày nâng cấp '+SAT[id].kinds[a.kind].n.toLowerCase()+' ở '+SAT[id].name+' lên cấp '+a.lv+'.','news');return '';
}
function satSell(G,id,i){
  var c=G.sat[id],a=c&&c.assets[i];if(!a)return 'Không tìm thấy.';if(G.P.jail>0)return 'Mày đang thụ án.';
  var v=satAssetVal(G,c,a),k=SAT[id].kinds[a.kind],get=Math.round(v*0.95);
  G.cash+=get;G.stats.tax+=v*0.02;c.assets.splice(i,1);
  c.L=clamp(c.L*(1-0.08*k.b[a.lv-1]/satCap(c)),0.35,5);
  logm(G,'Mày bán '+k.n.toLowerCase()+' ở '+SAT[id].name+' được '+get+' triệu (đã trừ thuế 2% và phí môi giới, thủ tục từ xa).','news');return '';
}
function satInfraPrice(G,c){return K(G,400*Math.pow(1.9,c.infra))}
function satInfra(G,id){
  var c=G.sat[id];if(!c||!c.open)return 'Chưa mở văn phòng ở vùng này.';if(G.P.jail>0)return 'Mày đang thụ án.';
  if(c.infra>=SAT_MAXINFRA)return 'Hạ tầng vùng đã ở mức cao nhất.';
  var p=satInfraPrice(G,c);if(G.cash<p)return 'Không đủ tiền (cần '+p+' triệu).';
  G.cash-=p;c.infra++;G.P.rep=clamp(G.P.rep+1,0,100);
  logm(G,'Mày góp vốn làm hạ tầng ở '+SAT[id].name+' ('+p+' triệu): hạ tầng cấp '+c.infra+'.','good');return '';
}
function satToggleIns(G,id){var c=G.sat[id];if(!c||!c.open)return 'Chưa mở văn phòng.';c.ins=!c.ins;logm(G,(c.ins?'Mua':'Hủy')+' bảo hiểm tài sản ở '+SAT[id].name+'.','news');return ''}
/* ---------- tác động ngược về thành phố nhà ---------- */
function satInfraOf(G,id){return G.sat&&G.sat[id]&&G.sat[id].open?G.sat[id].infra:0}
function satMul(G,t){
  if(!G.sat)return 1;
  var ty=t.t,cg=satInfraOf(G,'cang'),dl=satInfraOf(G,'dl');
  if(ty==='ind')return 1+0.030*cg;
  if(ty==='com')return 1+0.010*cg+0.008*dl;
  if(ty==='hotel'||ty==='fun')return 1+0.035*dl;
  return 1;
}
function satLive(G){return G.sat?1-0.012*satInfraOf(G,'nn'):1}
/* ---------- sự kiện ---------- */
function evSatShock(G,c){
  var d=SAT[c.id],sh=c.sh,base=satSupply(c),cost=Math.max(K(G,30),Math.round(K(G,base)*0.04)),ins=Math.round(K(G,base)*0.01);

var curWT=0,bursts=[];
function wealthTier(nw){return nw<800?0:nw<4000?1:nw<15000?2:3}
function layout(G,order){
  var items=[],x=16,gap=8,wt=curWT;
  function add(k,w,extra){var it={k:k,x:x,w:w};if(extra)for(var q in extra)it[q]=extra[q];items.push(it);x+=w+gap;return it}
  var villa=wt>=3&&!!(G&&G.home);
  add('home',villa?124:104,{has:!!(G&&G.home),villa:villa});
  var fam=G&&G.fam?(G.fam.married?1:0)+Math.min(2,G.fam.kids):0;
  items.push({k:'person',x:x,w:36+fam*18,fam:G?G.fam:null});x+=40+fam*18;
  if(!G)return {items:items,end:x,fork:true};
  if(wt>=1)add('car',68,{tier:wt});
  if(G.job&&G.job.on)add('office',100);
  if(G.show&&G.show.on)add('stage',124,{fame:G.show.fame});
  order.forEach(function(id){var b=G.biz[id];if(b&&b.lvl>0)add(id,SPR[id].w+(b.lvl>=2?14:0),{lvl:b.lvl,b:b})});
  var done=G.proj.filter(function(p){return p.done}).slice(-2),live=G.proj.filter(function(p){return !p.done});
  done.concat(live).forEach(function(p){add('site',p.tier===2?152:132,{p:p})});
  return {items:items,end:x};
}
function lscale(L){return Math.min(1,(W-36)/Math.max(1,L.end))}
function slotX(G,order,key){
  var LL=layout(G,order),L=LL.items,sc=lscale(LL);
  for(var i=0;i<L.length;i++)if(L[i].k===key)return (L[i].x+L[i].w/2)*sc;
  return 200;
}

/* ---- sao lưu / nhập ván bằng mã ---- */
function b64FromBytes(u8){var s='';for(var i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
function bytesFromB64(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function utf8enc(str){if(typeof TextEncoder!=='undefined')return new TextEncoder().encode(str);var b=unescape(encodeURIComponent(str)),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function utf8dec(u){if(typeof TextDecoder!=='undefined')return new TextDecoder().decode(u);var s='';for(var i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return decodeURIComponent(escape(s))}
function packSave(g,cb){
  var u=utf8enc(JSON.stringify(g));
  if(typeof CompressionStream!=='undefined'&&typeof Response!=='undefined'&&typeof Blob!=='undefined'){
    try{new Response(new Blob([u]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer().then(function(ab){cb('NGARE1:'+b64FromBytes(new Uint8Array(ab)))},function(){cb('NGARE0:'+b64FromBytes(u))});return}catch(e){}
  }
  cb('NGARE0:'+b64FromBytes(u));
}
function unpackSave(code,cb){
  code=String(code||'').trim();
  if(code.charAt(0)==='{'){try{return cb(null,JSON.parse(code))}catch(e){return cb('Mã không hợp lệ.')}}
  code=code.replace(/\s+/g,'');var m=/^NGARE([01]):([A-Za-z0-9+\/=]+)$/.exec(code);
  if(!m)return cb('Mã không hợp lệ: mã phải bắt đầu bằng NGARE và được chép đủ, không thiếu ký tự.');
  var u;try{u=bytesFromB64(m[2])}catch(e){return cb('Mã bị lỗi hoặc thiếu ký tự.')}
  function fin(bytes){var g;try{g=JSON.parse(utf8dec(bytes))}catch(e){return cb('Mã bị thiếu ký tự, không đọc được ván. Chép lại toàn bộ mã.')}cb(null,g)}
  if(m[1]==='0')return fin(u);
  if(typeof DecompressionStream==='undefined')return cb('Trình duyệt này quá cũ, không giải nén được mã. Hãy cập nhật trình duyệt.');
  try{new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer().then(function(ab){fin(new Uint8Array(ab))},function(){cb('Mã bị thiếu ký tự, không giải nén được. Chép lại toàn bộ mã.')})}catch(e){cb('Không giải nén được mã.')}
}

function spark(arr,col){
  var a=arr.slice(-14);if(a.length<2)return '';
  var mn=Math.min.apply(null,a),mx=Math.max.apply(null,a);if(mx-mn<1e-6)mx=mn+1;
  var pts=a.map(function(v,i){return ((i/(a.length-1))*100).toFixed(1)+','+(28-((v-mn)/(mx-mn))*24).toFixed(1)}).join(' ');
  return '<svg viewBox="0 0 100 32" preserveAspectRatio="none" class="spark"><polyline points="'+pts+'" fill="none" stroke="'+(col||'currentColor')+'" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>';
}

}

function drawAvatar(c,S,a,hp,stress,prof,mood,jail){

  c.fillStyle=jail?'#8a8a8a':(prof==='bacsi'?'#f4f4f4':prof==='congnhan'||prof==='xaydung'?'#e0a42d':prof==='nongdan'?'#6b7d3a':'#3b6fa8');
  c.beginPath();c.moveTo(8,104);c.quadraticCurveTo(12,72,52,70);c.quadraticCurveTo(92,72,96,104);c.closePath();c.fill();
  c.fillStyle='#e8c39a';c.fillRect(44,60,16,16);
  c.fillStyle=hp<40?'#dcbd9e':'#e8c39a';c.beginPath();c.ellipse(52,42,23,27,0,0,T2);c.fill();
  c.fillStyle=a>=58?'#e8e8e8':a>=42?'#9a9a9a':'#1a1a1a';c.beginPath();c.ellipse(52,26,25,15,0,Math.PI,T2);c.fill();c.fillRect(28,24,6,13);c.fillRect(70,24,6,13);
  c.fillStyle='#222';c.beginPath();c.arc(43,43,2.6,0,T2);c.arc(61,43,2.6,0,T2);c.fill();
  c.strokeStyle='#222';c.lineWidth=2.2;c.beginPath();var an=stress>40?3:0;c.moveTo(37,35);c.lineTo(48,35+an);c.moveTo(56,35+an);c.lineTo(67,35);c.stroke();
  if(hp<55){c.fillStyle='rgba(90,60,90,0.35)';c.beginPath();c.ellipse(43,49,5,2.6,0,0,T2);c.ellipse(61,49,5,2.6,0,0,T2);c.fill()}
  if(a>=44){c.strokeStyle='#333';c.lineWidth=1.6;c.beginPath();c.arc(43,43,7,0,T2);c.moveTo(68,43);c.arc(61,43,7,0,T2);c.moveTo(50,43);c.lineTo(54,43);c.stroke()}
  if(a>=48){c.strokeStyle='rgba(110,70,50,0.45)';c.lineWidth=1;c.beginPath();c.moveTo(38,54);c.quadraticCurveTo(42,57,46,54);c.moveTo(58,54);c.quadraticCurveTo(62,57,66,54);c.stroke()}

  c.stroke();c.restore();
}

function bindMap(){
  cv=document.getElementById('map');if(!cv||!cv.getContext)return;
  cx=cv.getContext('2d');
  if(!st.view)st.view=newSt().view;
  cv.style.touchAction='none';
  resizeMap();
  function pos(e){var r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
  function jump(p){var m=minimapHit(p.x,p.y);if(m){st.view.cx=m.x;st.view.cy=m.y;clampView(st.view);return true}return false}
  var pts={},pinch=null;
  function two(){var k=Object.keys(pts);return k.length>=2?[pts[k[0]],pts[k[1]]]:null}
  cv.onpointerdown=function(e){
    var p=pos(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}
    pts[e.pointerId]=p;var tw=two();
    if(tw){var a=tw[0],b=tw[1];pinch={d:Math.max(20,Math.hypot(a.x-b.x,a.y-b.y)),z:st.view.z,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,cx:st.view.cx,cy:st.view.cy};drag=null;st.dragging=true;return}
    if(jump(p)){drag={mini:true};return}
    drag={x:p.x,y:p.y,moved:false,cx:st.view.cx,cy:st.view.cy,thr:e.pointerType==='touch'?12:6};st.dragging=false;cv.style.cursor='grabbing'};
  cv.onpointermove=function(e){
    var p=pos(e);st.mx=p.x;st.my=p.y;
    if(pts[e.pointerId])pts[e.pointerId]=p;
    if(pinch){var tw=two();if(!tw)return;var a=tw[0],b=tw[1],d=Math.hypot(a.x-b.x,a.y-b.y),z=clamp(pinch.z*d/pinch.d,0.55,2.8);
      var wx=(pinch.mx-CW/2)/pinch.z+pinch.cx,wy=(pinch.my-CH/2)/pinch.z+pinch.cy,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      st.view.z=z;st.view.cx=wx-(mx-CW/2)/z;st.view.cy=wy-(my-CH/2)/z;clampView(st.view);return}
    if(drag&&drag.mini){jump(p);return}
    if(drag){var dx=p.x-drag.x,dy=p.y-drag.y;if(Math.abs(dx)+Math.abs(dy)>(drag.thr||6))drag.moved=true;if(drag.moved){st.dragging=true;st.view.cx=drag.cx-dx/st.view.z;st.view.cy=drag.cy-dy/st.view.z;clampView(st.view)}}
    else if(e.pointerType!=='touch')st.hover=pickTile(p.x,p.y,st.view);
  };
  cv.onpointerup=function(e){
    var p=pos(e);delete pts[e.pointerId];
    if(pinch){if(!two()){pinch=null;st.dragging=false}drag=null;return}
    if(drag&&!drag.mini&&!drag.moved){st.sel=pickTile(p.x,p.y,st.view);st.tileFold=false;refreshInfo();sfx('tick')}drag=null;st.dragging=false;cv.style.cursor='grab'};
  cv.onpointercancel=function(e){delete pts[e.pointerId];if(!two())pinch=null;drag=null;st.dragging=false};
  cv.onmouseleave=function(){st.hover=-1;st.mx=-1};
  cv.onwheel=function(e){e.preventDefault();var p=pos(e),before={x:(p.x-CW/2)/st.view.z+st.view.cx,y:(p.y-CH/2)/st.view.z+st.view.cy};st.view.z=clamp(st.view.z*(e.deltaY>0?0.9:1.12),0.55,2.8);st.view.cx=before.x-(p.x-CW/2)/st.view.z;st.view.cy=before.y-(p.y-CH/2)/st.view.z;clampView(st.view)};
  if(typeof ResizeObserver!=='undefined'){try{if(window._ro)window._ro.disconnect();window._ro=new ResizeObserver(resizeMap);window._ro.observe(cv)}catch(e){}}
  if(!rafOn&&typeof requestAnimationFrame==='function'){rafOn=true;requestAnimationFrame(frame)}
}
function focusTile(i){
  if(!G.T[i])return;st.sel=i;st.tileFold=false;var p=ptile(G.T[i].x,G.T[i].y);
  if(!st.view)st.view=newSt().view;st.view.cx=p.x;st.view.cy=p.y-20;st.view.z=Math.max(st.view.z,1.5);clampView(st.view);refreshInfo();

function frame(ts){
  if(cv&&cx&&G&&!G.over&&!document.hidden){
    var tm=ts/1000,growing=false;
    G.T.forEach(function(t,i){var v=st.vis[i];if(v===undefined)v=t.grow;var target=t.grow;if(v<target){v=Math.min(target,v+0.012);growing=true}else v=target;st.vis[i]=v});
    var tod=((tm/70)+0.25)%1,nf=Math.max(0,Math.min(1,0.5+1.1*Math.cos((tod-0.8)*6.283)));
    if(typeof matchMedia!=='undefined'&&matchMedia('(prefers-reduced-motion: reduce)').matches)nf=0;
    if(st.tab==='sat'&&((st.vf=(st.vf||0)+1)%2===0)&&!(typeof matchMedia!=='undefined'&&matchMedia('(prefers-reduced-motion: reduce)').matches))paintVistas(tm);
    st.nf=nf;var night=nf>0.5;
    if(night!==st.night){st.night=night;st.dirty=true}
    if(st.wasGrowing&&!growing)st.dirty=true;
    st.wasGrowing=growing;
    if(!(st.mob&&st.mv==='panel')){try{if(st.dirty||!CACHE)renderStatic(G,st);drawFrame(cx,G,tm,st)}catch(e){}}
  }
  requestAnimationFrame(frame);
}

    case 'upg':msg=upgradeTile(G,i);break;
    case 'reno':msg=renovateTile(G,i);break;
    case 'renoall':msg=renovateAll(G,isNaN(n)?0.55:n);break;
    case 'sellplot':msg=sellTile(G,i);break;
    case 'apply':msg=applyFor(G,i);break;
    case 'study':msg=startStudy(G);break;
    case 'quitjob':G.P.emp=-1;logm(G,'Mày nghỉ việc.','news');break;
    case 'profmodal':profModal();return;
    case 'chprof':msg=changeProf(G,id);hideOverlay();break;
    case 'move':msg=moveTo(G,id);break;
    case 'buyhome':msg=buyHome(G,id,parseFloat(t.dataset.p)||0.3);break;
    case 'demolish':msg=demolishTile(G,i,false);break;
    case 'demolishc':msg=demolishTile(G,i,true);break;
    case 'projcancel':msg=projCancel(G,parseInt(id,10));break;
    case 'qhreturn':{var qbb=qhBlock(G,parseInt(id,10));msg=qbb?qhReturn(G,qbb):'Không tìm thấy khối quy hoạch.';break}
    case 'dynbuy':msg=dynBuy(G,parseFloat(t.dataset.n)||0.03);break;
    case 'dynpeace':msg=dynPeace(G,parseInt(id,10));break;
    case 'dynally':msg=dynAlly(G,parseInt(id,10));break;
    case 'heritage':msg=heritageBuild(G,i,k);break;
    case 'cnd':st.cnD=id;render();return;
    case 'cnact':msg=cnAct(G,k,id);break;
    case 'ventstart':msg=ventStart(G);break;
    case 'ventup':msg=ventUpgrade(G);break;
    case 'ventmgr':msg=ventMgr(G);break;
    case 'ventsell':msg=ventSell(G);break;
    case 'ventgrant':msg=ventGrant(G);break;
    case 'codir':msg=coSetDir(G,id);break;
    case 'cord':msg=coSetRd(G,parseFloat(t.dataset.v));break;
    case 'buybuilt':msg=buyBuilt(G,i);break;
    case 'repay':msg=repayDebt(G,n);break;
    case 'borrow':msg=borrowMore(G,n);break;
    case 'flashx':st.flash=null;render();return;
    case 'sellhome':msg=sellHome(G);break;
    case 'actp':G.plan[k]=Math.min(3,(G.plan[k]||0)+1);break;
    case 'actm':G.plan[k]=Math.max(0,(G.plan[k]||0)-1);break;
    case 'endq':autoLeft=0;runQuarter();return;
    case 'endyear':autoLeft=4;runQuarter();return;
    case 'repok':nextQueue();return;
    case 'choice':{var res=afterChoice(G,cur,parseInt(t.dataset.i,10));drainFx();showOutcome(res);return}
    case 'resok':nextQueue();return;
  }
  if(msg){logm(G,msg,'bad');st.flash={t:msg,ok:false};toast(msg,true);sfx('alert')}
  else if(['buyplot','build','upg','reno','renoall','buyfin','buystake','sellplot','buyhome','legalize','cofound','coup','cosell','coissue','coplace','ipostart'].indexOf(a)>=0)sfx(a==='buyfin'||a==='buystake'||a==='sellplot'||a==='cosell'||a==='coissue'||a==='coplace'||a==='ipostart'?'money':'build');
  else if(a==='crime')sfx('alert');
  if(!msg&&['repay','borrow','buyhome','sellhome','buyplot','build','upg','reno','renoall','sellplot','move','demolish','demolishc','projcancel','qhreturn','heritage','cnact','dynbuy','dynpeace','dynally','ventstart','ventup','ventsell','ventgrant','buybuilt','codir','cord'].indexOf(a)>=0){var lg=G.log[0];if(lg&&lg.t)st.flash={t:lg.t,ok:true}}
  else if(!msg&&st.flash&&['zoom','focus','ov'].indexOf(a)<0)st.flash=null;
  checkAch(G);drainFx();
  render();save();
});
function showTutorial(){
  var seen=false;try{seen=!!localStorage.getItem('thanhpho_tut')}catch(e){}
  if(seen)return;try{localStorage.setItem('thanhpho_tut','1')}catch(e){}
  showOverlay('<h2>Cách chơi nhanh</h2><p>Mày sống ở thành phố này từ 22 đến 75 tuổi, rồi chia di sản cho con cái và chơi tiếp thế hệ kế tiếp trong cùng thành phố. Mỗi quý mày chia 6 điểm thời gian cho việc đi làm, học hỏi, giao lưu, nghỉ ngơi, rồi bấm Kết thúc quý (phím Space).</p><p><b>Việc làm:</b> nghề của mày thiếu hay thừa người quyết định lương và cơ hội thăng chức.<br><b>Bản đồ:</b> bấm một ô để mua đất, xây, góp vốn, xin việc. Mua từ 3 ô trống liền kề để lập dự án nhà ở.<br><b>Làm chủ:</b> lập doanh nghiệp rồi có thể lên sàn chứng khoán.<br><b>Đường tắt:</b> đi đường tắt thì có lợi ngay nhưng dễ bị điều tra, thậm chí ngồi tù.<br><b>Bạn cùng lớp:</b> cùng khóa mà chọn đường khác, 5 năm họp lớp một lần để so sánh.<br><b>Cột bên phải</b> chia thành các tab. Tab <b>Quý này</b> luôn có danh sách việc nên làm, mỗi tab có chấm số cho biết có việc cần chú ý.</p><button class="choice" data-act="tutok"><b>Bắt đầu</b></button>');
}
function toggleFS(){
  var el=document.documentElement,msgFS='Khung xem trước có thể chặn toàn màn hình. Hãy mở trang ở tab riêng rồi bấm lại, hoặc bấm F11.';
  try{
    if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
    else{var rq=el.requestFullscreen||el.webkitRequestFullscreen;if(!rq){toast(msgFS);return}var pr=rq.call(el);if(pr&&pr.catch)pr.catch(function(){toast(msgFS)})}
  }catch(e){toast(msgFS)}
}
document.addEventListener('scroll',function(e){var tg=e.target;if(!tg||!tg.classList||!scrollMem.live)return;if(tg.classList.contains('sidecol'))scrollMem.side=tg.scrollTop;else if(tg.id==='tileinfo')scrollMem.tile=tg.scrollTop;else if(tg.classList.contains('log'))scrollMem.log=tg.scrollTop},true);
document.addEventListener('input',function(e){if(e.target&&e.target.id==='lname')LG.name=e.target.value;if(e.target&&e.target.id==='pname')I.name=e.target.value});
document.addEventListener('keydown',function(e){
  if(!G||G.over||!ov.hidden)return;
  var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA')return;
  var k=e.key,V=st.view;if(!V)return;
  if(k===' '||e.code==='Space'){e.preventDefault();autoLeft=0;runQuarter()}
  else if(k==='y'||k==='Y'){autoLeft=4;runQuarter()}
  else if(k==='+'||k==='='){V.z=clamp(V.z*1.15,0.55,2.8);clampView(V)}
  else if(k==='-'||k==='_'){V.z=clamp(V.z/1.15,0.55,2.8);clampView(V)}
  else if(k==='f'||k==='F')toggleFS();
  else if(k>='1'&&k<='9'){var tb=visTabs()[parseInt(k,10)-1];if(tb&&st.tab!==tb[0]){st.tab=tb[0];st.tabReset=true;render()}}
  else if(k==='Escape'){st.sel=-1;refreshInfo()}
  else if(k==='ArrowLeft'){e.preventDefault();V.cx-=60/V.z;clampView(V)}
  else if(k==='ArrowRight'){e.preventDefault();V.cx+=60/V.z;clampView(V)}
  else if(k==='ArrowUp'){e.preventDefault();V.cy-=60/V.z;clampView(V)}
  else if(k==='ArrowDown'){e.preventDefault();V.cy+=60/V.z;clampView(V)}
});
if(window.addEventListener)window.addEventListener('resize',function(){if(G&&!G.over&&isMob()!==!!st.mob){render();return}fitLayout();resizeMap()});
document.addEventListener('fullscreenchange',function(){setTimeout(function(){fitLayout();resizeMap()},80)});
G=null;
render();
})();
/*UI_END*/
