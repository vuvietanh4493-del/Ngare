<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ngã rẽ: Thành phố</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#a8281c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ngã rẽ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Noto+Serif:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e9e2cf; --panel:#f7f1e3; --panel2:#efe6d0; --ink:#1f1b13; --muted:#6b604d; --line:#d3c7a8;
  --red:#a8281c; --red-fg:#fff; --gold:#8f6400; --good:#2c7138; --bad:#b3261e; --focus:#1f5fbf;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1310; --panel:#141c17; --panel2:#1a241e; --ink:#ece6d4; --muted:#9aa596; --line:#28352d;
    --red:#e5624a; --red-fg:#1a0803; --gold:#f2c14e; --good:#7fd08f; --bad:#ff8068; --focus:#8cb8ff;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1310; --panel:#141c17; --panel2:#1a241e; --ink:#ece6d4; --muted:#9aa596; --line:#28352d;
  --red:#e5624a; --red-fg:#1a0803; --gold:#f2c14e; --good:#7fd08f; --bad:#ff8068; --focus:#8cb8ff;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,"Segoe UI",sans-serif;font-size:14.5px;line-height:1.5}
h1,h2,h3{font-family:"Noto Serif",Georgia,serif;margin:0;line-height:1.2}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:none;margin:0 auto;padding:8px 10px 64px}
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:4px 0 10px;border-bottom:2px solid var(--ink)}
.brand h1{font-size:24px;font-weight:900}
.brand .sub{color:var(--muted);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 9px;min-width:84px}
.chip small{display:block;color:var(--muted);font-size:11px}
.chip b{font-size:15px;font-variant-numeric:tabular-nums}
.chip .sub2{display:block;font-size:11px;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:10px;margin-top:8px;height:calc(100vh - 190px);min-height:440px}
.mapcol{position:relative;min-width:0;height:100%}
.sidecol{display:flex;flex-direction:column;gap:10px;min-width:0;height:100%;overflow:auto;padding-right:4px}
.mapwrap{position:relative;height:100%;background:#1c2a24;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
#map{display:block;width:100%;height:100%;cursor:grab}
.maptop{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoomc{display:flex;gap:6px}
.ticker{position:absolute;left:0;right:0;top:0;height:26px;overflow:hidden;background:rgba(30,27,22,.82);color:#f4ecd0;font-size:12.5px;line-height:26px;white-space:nowrap;z-index:1}
.ticker span{display:inline-block;padding-left:100%;animation:tick 70s linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-100%)}}
#tileinfo{position:absolute;left:8px;bottom:8px;width:min(470px,calc(100% - 250px));max-height:calc(100% - 150px);overflow:auto;z-index:2;overscroll-behavior:contain}
.tfhead{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel2,var(--panel));padding:4px 8px;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;font-size:12px;color:var(--muted)}
.tfhead .btn{padding:2px 9px;font-size:12px}
#tileinfo .tfhead+.card{margin-top:0!important;border-top-left-radius:0;border-top-right-radius:0}
#app.gm{display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:560px;padding:8px 10px;box-sizing:border-box}
#app.gm .top{flex:none}
#app.gm .layout{flex:1 1 auto;min-height:0;height:auto;margin-top:8px;grid-template-rows:minmax(0,1fr)}
#app.gm .foot{position:static;flex:none;margin-top:8px;border:2px solid var(--ink);border-radius:6px}
#app.gm .mapcol,#app.gm .sidecol{height:auto;min-height:0}
#app.gm .mapwrap{height:100%}
.est{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
.est td{padding:2px 4px;border-bottom:1px dashed var(--line)}
.est td:nth-child(n+2){text-align:right;white-space:nowrap}
#tileinfo .card.tf{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 10px}
#tileinfo .card{margin-top:0!important;opacity:.97}
@media (max-width:980px){#app.gm{height:auto;min-height:0}#app.gm .layout{flex:none;display:block}#app.gm .foot{position:sticky;bottom:0}#app.gm .mapcol{height:64vh;min-height:380px}.layout{display:block;height:auto}.mapcol{height:64vh;min-height:380px}.sidecol{height:auto;overflow:visible;margin-top:10px}#tileinfo{position:static;width:auto;max-height:none}.mapwrap{height:100%}}
@media (prefers-reduced-motion: reduce){.ticker span{animation:none;padding-left:8px}}

/* ---- điện thoại ---- */
body.mobbody{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body.mobbody button{touch-action:manipulation}
#app.gm.mob{height:100vh;height:100dvh;min-height:0;padding:0;display:flex;flex-direction:column;overflow:hidden}
#app.gm.mob .mtop{flex:none;padding:6px 10px 6px;padding-top:calc(6px + env(safe-area-inset-top,0px));border-bottom:2px solid var(--ink);background:var(--bg);position:relative}
.mrow{display:flex;align-items:center;gap:8px}
.mrow canvas.av{width:34px;height:34px;border-width:1.5px}
.mname{flex:1;min-width:0;line-height:1.25}
.mname b{font-family:"Noto Serif",Georgia,serif;font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mname span{font-size:11.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{flex:none;width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:20px;line-height:1;font-weight:700}
.mchips{display:flex;gap:6px;overflow-x:auto;margin-top:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mchips::-webkit-scrollbar,.mob .tabs::-webkit-scrollbar,.mob .ovbar::-webkit-scrollbar{display:none}
.mchip{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px;line-height:1.2}
.mchip small{display:block;font-size:10.5px;color:var(--muted)}
.mchip b{font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mmenu{position:absolute;right:10px;top:calc(50px + env(safe-area-inset-top,0px));z-index:30;background:var(--panel);border:2px solid var(--ink);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.mmenu .btn{text-align:left}
#app.gm.mob .jail{margin:0;border-radius:0;font-size:12.5px;padding:6px 10px;flex:none}
#app.gm.mob .layout{flex:1 1 auto;min-height:0;height:auto;margin:0;display:block;grid-template-columns:none}
#app.gm.mob .mapcol{height:100%;min-height:0}
#app.gm.mob .mapwrap{height:100%;border:0;border-radius:0}
#app.gm.mob .sidecol{height:100%;min-height:0;overflow-y:auto;overflow-x:hidden;margin:0;padding:0 10px 14px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#app.gm.mob.mv-map .sidecol{display:none}
#app.gm.mob.mv-panel .mapcol{display:none}
#app.gm.mob .sidehead{padding-top:8px}
.mob .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.mob .tabs button{flex:none;padding:9px 13px;font-size:14px}
.mob .maptop{left:6px;right:6px}
.mob .ovbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-right:54px}
.mob .ovbar .seg{flex:none}
.mob .zoomc{position:absolute;right:0;top:0;flex-direction:column}
.mob .zoomc .btn{width:44px;min-height:44px;padding:0;font-size:18px}
.mob .zoomc .btn[data-id="home"]{font-size:0}
.mob .zoomc .btn[data-id="home"]::after{content:"⌂";font-size:20px}
.mob .ticker{font-size:12px}
.mob .mflash{position:absolute;left:8px;right:8px;top:80px;z-index:4}
.mob .mflash:empty{display:none}
#app.gm.mob #tileinfo{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:56%;border-radius:12px 12px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.25)}
#app.gm.mob #tileinfo.nosel{display:none}
#app.gm.mob #tileinfo .card{border-radius:0;opacity:1}
#app.gm.mob .tfhead{border-radius:12px 12px 0 0;padding:6px 10px;font-size:13px}
#app.gm.mob .foot.mfoot{position:static;flex:none;margin:0;border:0;border-top:2px solid var(--ink);border-radius:0;padding:7px 8px calc(7px + env(safe-area-inset-bottom,0px));gap:6px;display:flex;align-items:center}
.mseg{display:flex;border:1px solid var(--ink);border-radius:8px;overflow:hidden;flex:none}
.mseg button{border:0;background:var(--panel);padding:0 12px;min-height:42px;font-weight:700;font-size:14px;position:relative}
.mseg button.on{background:var(--ink);color:var(--bg)}
.mseg .bd{display:inline-block;min-width:16px;height:16px;line-height:16px;border-radius:8px;margin-left:4px;padding:0 4px;font-size:11px;text-align:center;background:var(--muted);color:#fff}
.mseg .bd.u{background:var(--bad)}
.mpts{flex:1;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums;min-width:40px}
.mpts b{font-size:16px;display:block}.mpts small{font-size:10.5px;color:var(--muted)}
.mfoot .btn{min-height:42px;font-size:14px;padding:0 12px;flex:none}
.mob .btn{min-height:38px;padding:7px 12px;font-size:14px}
.mob .seg{min-height:36px;padding:6px 12px;font-size:13.5px}
.mob .step button{width:36px;height:36px;font-size:17px}
.mob .pick button{min-height:48px}
.mob .card{padding:11px 12px}
.mob .card p{font-size:13.5px}
.mob .note{font-size:12.5px}
.mob .kbd{display:none}
.mob .todo{flex-wrap:wrap}
@media (max-height:540px){#app.gm.mob .mtop{display:flex;align-items:center;gap:8px;padding:4px 8px}.mob .mrow{flex:none;max-width:40%}.mob .mrow canvas.av{display:none}.mob .mchips{flex:1;margin-top:0}.mob .mchip{padding:2px 7px}.mob .mmenu{top:48px}#app.gm.mob .foot.mfoot{padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}.mseg button,.mfoot .btn{min-height:38px}.mob .ticker{display:none}.mob .maptop{top:6px!important}}
body.mobbody .overlay{align-items:flex-end;padding:0}
body.mobbody .modal{max-width:none;border-radius:14px 14px 0 0;border-width:2px 0 0;max-height:90vh;max-height:90dvh;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px))}
body.mobbody .choice{padding:11px 13px;min-height:52px;margin-top:8px}
body.mobbody .choice b{font-size:15px}
body.mobbody .choice small{font-size:12.5px}
.codebox{display:block;width:100%;box-sizing:border-box;height:150px;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--ink);resize:vertical}
.evart{display:block;width:100%;height:auto;border-radius:4px;margin:-4px 0 12px;border:1px solid var(--line)}
canvas.vista{width:100%;height:auto;border-radius:6px;border:1px solid var(--line);display:block;margin:6px 0 4px}
canvas.av{width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);flex:none}
.headrow{display:flex;gap:10px;align-items:center}
.nameinp{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel2);color:var(--ink);width:260px;max-width:100%}
.kbd{font-size:11.5px;color:var(--muted)}
.sidehead{position:sticky;top:0;z-index:6;background:var(--bg);padding-bottom:6px;display:flex;flex-direction:column;gap:6px}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs button{position:relative;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px;padding:6px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs .bd{display:inline-block;min-width:16px;height:16px;line-height:16px;border-radius:8px;margin-left:5px;padding:0 4px;font-size:11px;text-align:center;background:var(--muted);color:#fff}
.tabs .bd.u{background:var(--bad)}
.todo{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.todo b.u{color:var(--bad)}
.flash{position:relative;z-index:5;background:#4a1f1a;color:#ffe3dc;border:2px solid var(--bad);border-radius:6px;padding:8px 34px 8px 10px;font-weight:600;font-size:13px;line-height:1.4}
.flash button{position:absolute;right:6px;top:6px;border:0;background:transparent;color:#ffe3dc;font-size:16px;cursor:pointer}
.flash.ok{background:#1f3a22;border-color:var(--good);color:#d9f5dd}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.card h3{font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 small{font-family:"Be Vietnam Pro",sans-serif;font-weight:500;color:var(--muted);font-size:12px}
.card p{margin:5px 0;color:var(--muted);font-size:13px}
.ovbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.seg{background:var(--panel2);border:1px solid var(--line);padding:4px 10px;font-size:12.5px;border-radius:4px}
.seg.on{background:var(--red);border-color:var(--red);color:var(--red-fg);font-weight:700}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-size:12.5px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--red);border-color:var(--red);color:var(--red-fg);font-weight:700}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:5px 10px;margin-top:6px;font-size:13px}
.kv span{color:var(--muted);display:block;font-size:11px}
.kv b{font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.neg{color:var(--bad)}
.note{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--gold)}
table.lm{width:100%;border-collapse:collapse;font-size:12.5px}
table.lm th,table.lm td{padding:4px 5px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.lm th:first-child,table.lm td:first-child{text-align:left}
table.lm tr.me{background:var(--panel2);font-weight:700}
.tag{display:inline-block;font-size:11.5px;border-radius:999px;padding:1px 8px;border:1px solid var(--line)}
.tag.thieu{border-color:var(--good);color:var(--good)}.tag.thua{border-color:var(--bad);color:var(--bad)}
.spark{width:62px;height:20px;color:var(--gold);vertical-align:middle}
.log{max-height:240px;overflow:auto;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.log div{border-left:3px solid var(--line);padding-left:7px}
.log .news{border-color:var(--gold)}.log .bad{border-color:var(--bad)}.log .good{border-color:var(--good)}
.log small{color:var(--muted)}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:2px solid var(--ink);padding:7px 12px calc(7px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:5}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{width:22px;height:22px;border-radius:4px;border:1px solid var(--line);background:var(--panel2);line-height:1}
.overlay{position:fixed;inset:0;background:rgba(10,8,4,.62);display:flex;align-items:center;justify-content:center;padding:12px;z-index:20;overflow:auto}
.overlay[hidden]{display:none}
.modal{background:var(--panel);border:2px solid var(--ink);border-radius:6px;max-width:560px;width:100%;padding:16px;max-height:92vh;overflow:auto}
.modal h2{font-size:20px;margin-bottom:6px}
.modal p{margin:6px 0 10px}
.choice{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:8px 11px;margin-top:7px}
.choice:hover{border-color:var(--ink)}
.choice b{display:block}.choice small{color:var(--muted);font-size:12px}
table.rep{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
table.rep td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.rep td:first-child{text-align:left}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:7px;margin:8px 0 12px}
.pick button{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:8px 10px;text-align:left}
.pick button.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.pick small{display:block;color:var(--muted);font-size:11.5px}
.vac{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0;font-size:12.5px}
.chart{width:100%;height:150px;display:block}
.jail{background:#3a1d1d;color:#ffd9d0;border:2px solid var(--bad);border-radius:6px;padding:8px 12px;margin-top:8px;font-weight:700}
.zoom{display:flex;gap:6px;align-items:center;margin:6px 0 0}
.zoom .btn{min-width:34px}
.crime{border-color:var(--bad)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="overlay" id="overlay" hidden></div>
<script>
/*ENGINE_START*/
var W=49,H=41,Q_TOTAL=212,START_AGE=22,RET_AGE=75;
var DIST={
  tt:{name:'Trung tâm',base:2.4,cx:16,cy:12},
  tay:{name:'Khu Tây (dân cư)',base:1.3,cx:5,cy:12},
  dong:{name:'Khu Đông (công nghiệp)',base:1.1,cx:28,cy:12},
  bac:{name:'Khu Bắc (đô thị mới)',base:1.2,cx:16,cy:3},
  nam:{name:'Khu Nam (ven đô)',base:0.7,cx:16,cy:21},
  vt:{name:'Khu vệ tinh (vành đai mới)',base:0.8,cx:36,cy:20},
  dt:{name:'Khu đô thị mới (vành đai ngoài)',base:0.7,cx:45,cy:20}
};
var DK=['tt','tay','dong','bac','nam','vt','dt'];
var UNLOCK_TH=[8000,16000,24000,38000];
function phaseOf(x,y){if(x<33&&y<25)return 0;if(y>=33)return 4;if(x>=41)return 3;if(y>=25)return 2;return 1}
function distOpen(G,d){return d==='vt'?G.unlock>=1:d==='dt'?G.unlock>=3:true}

function vacancies(G){

function laborStep(G,A){
  var C=G.city,workers=C.pop*eraWf(G),tot=0,desire={};
  SKILLED.forEach(function(p){var d=BASE_SHARE[p]*Math.max(0.3,G.w[p]);desire[p]=d;tot+=d});
  SKILLED.forEach(function(p){
    var q=G.pipe[p],inflight=0;q.forEach(function(x){inflight+=x});
    var gap=A.D[p]*1.04-G.S[p]-inflight,capShare=A.eduCap*desire[p]/tot;
    var enr=clamp(0.006*A.D[p]+gap/10,0,capShare);
    if(p==='bacsi')enr=Math.min(enr,A.hospLv*1.5+0.5);
    q.push(enr);var grad=q.shift();
    G.S[p]=G.S[p]*(1-0.006)+grad;
    var sh=(A.D[p]-G.S[p])/Math.max(5,A.D[p]);if(sh>0.15&&G.w[p]>1.1)G.S[p]+=G.S[p]*0.012;
  });
  var ss=0;SKILLED.forEach(function(p){ss+=G.S[p]});
  var rem=Math.max(0,workers-ss),ws=0;
  UNSK.forEach(function(p){ws+=Math.max(1,A.D[p])*Math.pow(G.w[p],1.5)});
  UNSK.forEach(function(p){G.S[p]=rem*Math.max(1,A.D[p])*Math.pow(G.w[p],1.5)/ws});
  var u=0;
  PK.forEach(function(p){
    var D=Math.max(1,A.D[p]),s=(D-G.S[p])/D,tg=s>0?1+0.9*s:1+0.7*s;tg=clamp(tg,0.75,1.7);
    G.w[p]+=(tg-G.w[p])*0.25;u+=Math.max(0,G.S[p]-A.D[p]);
  });
  C.unemp=u/Math.max(1,workers);
  var needPop=A.Dsum/eraWf(G),target=Math.min(A.cap*0.97,needPop*1.03);
  C.pop+=(target-C.pop)*0.14;
  C.gdp=0;PK.forEach(function(p){C.gdp+=Math.min(G.S[p],A.D[p])*PROF[p].base*G.w[p]*3});
}
function landStep(G,A){
  var C=G.city;
  DK.forEach(function(d){
    var pol=d==='dong'?0:0.3*clamp(A.dInd[d]/Math.max(1,A.plots[d])*1.2,0,1);
    var tg=DIST[d].base*(0.75+1.0*A.dDens[d]+0.4*A.dSvc[d])*(1-pol)*Math.pow(Math.max(0.5,C.pop/C.pop0),0.3)*G.lm[d]*eraL(G,d)*(1-0.26*clamp(((A.dWear&&A.dWear[d])||0)-0.3,0,0.7)/0.7);
    G.land[d]+=(tg-G.land[d])*0.1;
  });
  for(var d in G.lm)G.lm[d]+=(1-G.lm[d])*0.02;
}
function pickType(needs){
  var tot=0,ks=[];for(var k in needs)if(needs[k]>0.02){ks.push(k);tot+=needs[k]}
  if(!ks.length)return null;var r=Math.random()*tot;
  for(var i=0;i<ks.length;i++){r-=needs[ks[i]];if(r<=0)return ks[i]}return ks[0];
}
function placeBuilding(G,type,lvOnly){
  var best=null,bs=-1,tries=0,T=G.T;
  for(var n=0;n<60;n++){
    var t=T[Math.floor(Math.random()*T.length)];
    if(t.t!=='empty'||t.own||t.qh)continue;
    var pf=prefOf(G,t.d,type);if(!pf)continue;
    var s=pf*(0.4+neighbors(G,t.x,t.y)/4)*(0.5+Math.random());
    if(s>bs){bs=s;best=t}
  }
  if(best){best.t=type;best.lv=1;best.grow=0;return best}

function upgradeSome(G,type){
  var best=null,bs=-1;
  G.T.forEach(function(t){
    if(t.t!==type||t.own||t.lv>=((type==='res'||type==='office')?4:3)||t.grow<1)return;
    if(t.lv===1&&G.land[t.d]<1.0)return;
    if(t.lv===2&&G.land[t.d]<1.7)return;
    if(t.lv===3&&G.land[t.d]<3.0)return;
    var s=G.land[t.d]*(0.5+Math.random());if(s>bs){bs=s;best=t}
  });
  if(best){best.lv++;best.grow=0;return best}return null;
}

  }

  var want={edu:1+Math.floor(C.pop/3500),hosp:1+Math.floor(C.pop/5000),gov:1+Math.floor(C.pop/6000),park:Math.floor(C.pop/2500),sport:1+Math.floor(C.pop/8000),culture:1+Math.floor(C.pop/9000),fun:1+Math.floor(C.pop/10000)};

  });
}

function rollEvents(G){
  var out=[],m=G.marks;
  if(G.q<=0)return out;
  if(qi(G)===1)out.push(evTet(G));
  if((m.health>30&&Math.random()<Math.min(0.55,(m.health-30)/100))||G.P.health<25)out.push(evBenh(G));
  // sự kiện thành phố
  if(Math.random()<0.16){
    var cl=CITY_EV.filter(function(x){return x.when(G)});
    if(cl.length){var ce=pickWeighted(cl,G),cmsg=ce.ap(G);logm(G,cmsg,'news');if(CITY_MEM[ce.id])mem(G,'city',CITY_MEM[ce.id],0.7);G.stats.events++}
  }
  // sự kiện theo nghề (10%/quý)
  if(Math.random()<0.1&&(G.cool['pe_'+G.P.prof]||0)<=G.q&&PROF_EV[G.P.prof]){G.cool['pe_'+G.P.prof]=G.q+10;out.push(PROF_EV[G.P.prof](G))}
  var n=Math.random()<0.4?2:1;
  for(var i=0;i<n;i++){
    var el=PERS.filter(function(x){return x.w>0&&(G.cool[x.id]||0)<=G.q&&x.when(G)});
    if(!el.length)break;var ev=pickWeighted(el,G);G.cool[ev.id]=G.q+ev.cool;var mv=ev.make(G);if(mv)out.push(mv);
  }
  return out;
}
function fixCash(G){
  if(G.cash<0){var need=-G.cash;G.debt+=need;G.cash=0;addMark(G,'legal',0);logm(G,'Thiếu tiền mặt: mày vay thêm '+Math.round(need)+' triệu.','bad')}
}
function afterChoice(G,ev,idx){
  var r=ev.choices[idx].do(G);fixCash(G);fixEmp(G);
  if(r)logm(G,ev.title+': '+r,'');G.stats.events++;return r;
}

/* ---------- tài sản, điểm thời gian, kết thúc quý ---------- */
function ownedTiles(G){var o=[];G.T.forEach(function(t,i){if(t.own)o.push(i)});return o}
function netWorth(G){
  var v=G.cash+homeValue(G)-G.debt+finTotal(G)+stakesValue(G)+coStakeValue(G)+projEquity(G)+ventValue(G)+satValue(G);
  G.T.forEach(function(t){if(t.own)v+=tileValue(G,t)});
  return v;
}
function pointsTotal(G){
  var a=age(G),P=G.P,t=a<50?6:a<57?5:a<65?4:3;
  if(commute(G)>14)t-=1;
  return Math.max(2,t-(G.sick>0?3:0)-(P.fam.kids>0?1:0));
}
function pointsUsed(G){
  var u=0,P=G.P;
  if(P.emp>=0)u+=3;
  if(P.study>0)u+=1;
  var nb=0;G.T.forEach(function(t){if(t.own&&t.t!=='empty')nb++});if(nb>=3)u+=1;
  if(G.co&&!G.co.closed&&!G.co.ceo)u+=1;
  if(G.vent&&!G.vent.closed&&!G.vent.mgr)u+=1;
  u+=Math.min(2,G.projs.filter(function(p){return !p.done&&!p.failed}).length);
  for(var k in G.plan)u+=G.plan[k];
  return {used:u,total:pointsTotal(G)};
}
function livingQ(G){
  var P=G.P,a=age(G);
  var v=(8+(P.fam.married?5:0)+P.fam.kids*9)*G.infl+(a>=50?(a-49)*0.5*G.infl:0)+Math.min(30*G.infl,Math.max(0,G.cash)*0.003);
  if(!P.res.own&&!(P.free>0))v+=rentQ(G,P.res.d);
  v+=commute(G)*0.15*G.infl;
  v+=0.5*Math.max(0,P.lastSal/G.infl*3*0.895-45)*G.infl*Math.min(1,0.5+0.1*(a-22)/4);
  return v*satLive(G);
}
function pension(G){
  var q=G.bhxh.q,y=q/4,yi=Math.floor(y),avg=q>0?G.bhxh.sum/q:0,rate=0,monthly=0,lump=0;
  if(yi>=15){rate=yi<20?0.40+0.01*(yi-15):Math.min(0.75,0.45+0.02*(yi-20));monthly=avg*rate}else lump=yi*2*avg;
  return {years:y,avg:avg,rate:rate,monthly:monthly,lump:lump};
}
function retireInfo(G){
  var pn=pension(G),liq=Math.max(0,G.cash)+finTotal(G),rent=0;
  G.T.forEach(function(t){if(t.own&&t.t!=='empty')rent+=Math.max(0,plotIncome(G,t))});
  var passive=pn.monthly+(0.04*liq)/12+rent/3*0.8+coPassive(G)+ventPassive(G)+satPassive(G),living=livingQ(G)/3;
  return {pn:pn,passive:passive,living:living,cover:living>0?passive/living:0,rentM:rent/3};
}

var FK=['tk','vang','ck','tp','tien'];
function finValue(G,k){return (k==='tk'||k==='tp')?G.fin[k]:G.fin[k]*G.px[k]}
function finTotal(G){var v=0;FK.forEach(function(k){v+=finValue(G,k)});return v}
function buyFin(G,k,amt){
  if(G.P.jail>0)return 'Mày đang thụ án.';
  if(amt<=0)return '';if(G.cash<amt)return 'Không đủ tiền.';
  G.cash-=amt;if(k==='tk'||k==='tp')G.fin[k]+=amt;else G.fin[k]+=amt/G.px[k];return '';
}
function sellFin(G,k,amt){
  var v=finValue(G,k);amt=Math.min(amt,v);if(amt<=0.01)return 'Không có gì để bán.';
  if(k==='tk'||k==='tp'){G.fin[k]-=amt;G.cash+=amt}else{G.fin[k]-=amt/G.px[k];G.cash+=amt*(k==='ck'?0.998:1)}
  return '';
}
function finStep(G,R){
  var F=G.flags,px=G.px,e=G.fin;
  px.vang=clamp(px.vang*(1+0.009+randn()*0.03),0.3,30);
  px.ck=clamp(px.ck*(1+0.02+randn()*0.09+(F.recession>0?-0.03:0)+(F.boom>0?0.01:0)),0.2,40);
  var cr=px.tien*(1+0.012+randn()*0.2);if(Math.random()<0.012)cr*=0.4;if(Math.random()<0.01)cr*=2.2;px.tien=clamp(cr,0.02,80);
  e.tk*=1.0122;
  var y=e.tp*0.022;G.cash+=y;R.fin=y;
  if(e.tp>0&&Math.random()<(F.recession>0?0.03:0.008)){var lost=e.tp*0.65;e.tp-=lost;logm(G,'Doanh nghiệp phát hành trái phiếu mày đang giữ vỡ nợ: mất '+Math.round(lost)+' triệu vốn.','bad')}
}
function stakeable(t){return ['res','com','ind','office','edu','hosp','farm'].indexOf(t.t)>=0&&t.lv>0&&!t.own&&t.grow>=1&&!t.her}
function stakeOn(G,i){var n=0;G.stakes.forEach(function(s){if(s.i===i)n+=s.pct});return n}
function buyStake(G,i,pct){
  var t=G.T[i];if(G.P.jail>0)return 'Mày đang thụ án.';
  if(!stakeable(t))return 'Không góp vốn được vào công trình này.';
  if(stakeOn(G,i)+pct>0.6)return 'Tối đa 60% một công trình.';
  var price=Math.round(pct*tileValue(G,t));if(G.cash<price)return 'Không đủ tiền (cần '+price+' triệu).';
  G.cash-=price;G.stakes.push({i:i,pct:pct,paid:price});
  logm(G,'Mày góp vốn '+Math.round(pct*100)+'% vào '+BLD[t.t]+' ở '+DIST[t.d].name+' ('+price+' triệu).','news');return '';
}
function stakeVal(G,s){var t=G.T[s.i];return s.pct*tileValue(G,t)*0.95}
function stakesValue(G){var v=0;G.stakes.forEach(function(s){v+=stakeVal(G,s)});return v}
function sellStake(G,k){var s=G.stakes[k];if(!s)return '';var v=Math.round(stakeVal(G,s));G.cash+=v;G.stakes.splice(k,1);logm(G,'Mày rút vốn khỏi một công trình, thu về '+v+' triệu.','news');return ''}

function mainCrimeKey(G){var b=null,m=0;for(var k in G.crimes)if(G.crimes[k]>m){m=G.crimes[k];b=k}return b}
function verdict0(G,S){
  if(mainCrimeKey(G)==='canhtranh'&&S>=60)S=59;
  var P=G.P,nm=mainCrime(G),fine=K(G,20+G.evid*0.7),out;
  if(P.prof==='luatsu')S-=8+2*P.rank;
  if(S<35){var f=Math.round(fine*0.5);G.cash-=f;addMark(G,'legal',-30);G.evid*=0.5;out='Mày bị nhắc nhở và phạt hành chính '+f+' triệu.'}
  else if(S<60){
    G.cash-=fine;addMark(G,'legal',-35);P.rep=clamp(P.rep-15,0,100);G.evid*=0.3;
    out='Mày bị xử phạt và truy thu '+Math.round(fine)+' triệu.';
    if(P.rank>0&&P.emp>=0){P.rank--;out+=' Chức danh bị hạ một bậc.'}
  }else{
    var n=S<80?ri(6,12):ri(12,24),conf=S<80?0.3:0.5,loss=Math.round(Math.max(0,G.cash)*conf);
    G.cash-=loss+fine;P.jail=n;P.emp=-1;P.study=0;G.stats.jail=(G.stats.jail||0)+n;G.crimes={};G.evid=0;
    for(var k in G.plan)G.plan[k]=0;
    out='Tòa tuyên mày '+(Math.round(n/4*10)/10).toString().replace('.',',')+' năm tù về '+nm+'. Tịch thu và phạt tổng cộng '+Math.round(loss+fine)+' triệu.';
  }
  return out;
}

/* ---------- kết thúc quý ---------- */
function endQuarter(G){
  var P=G.P,qn=qi(G),R={cash0:G.cash,sal:0,rent:0,living:0,interest:0,acts:0,sched:0,tax:0,fin:0},k,evs=[];
  eraStep(G,evs);
  var A=agg(G);G.agg=A;
  laborStep(G,A);landStep(G,A);growCity(G,A);growAnim(G);decayStep(G,evs);
  G.agg=agg(G);A=G.agg;
  finStep(G,R);
  var enf=G.flags.anticorr>0?2.2:1,jailed=P.jail>0;
  coStep(G,R,evs);
  botStep(G,evs);
  dynStep(G,evs);
  legStep(G,evs);
  satStep(G,R,evs);
  ventStep(G,R,evs);
  classStep(G);
  projStep(G,R,evs);
  planStep(G,evs);
  qhStep(G,evs);
  // lịch hẹn
  G.sched=G.sched.filter(function(s){
    if(s.q<=G.q){
      if(s.tile!=null){var t=G.T[s.tile];if(t&&t.own){t.prem=s.prem;logm(G,s.prem>1?'Tin quy hoạch thành sự thật: ô đất mày mua tăng giá mạnh.':'Tin quy hoạch hóa ra chỉ là tin đồn, ô đất mất giá.',s.prem>1?'good':'bad')}}
      else{G.cash+=s.cash;R.sched+=s.cash;logm(G,s.m,s.cash>0?'good':'bad')}
      return false;
    }
    return true;
  });
  fixEmp(G);
  if(jailed){
    P.jail--;P.health=clamp(P.health-2,0,100);P.happy=clamp(P.happy-2,0,100);P.emp=-1;
    if(P.jail===0){P.record=true;P.rep=Math.min(P.rep,15);G.marks.legal=Math.min(G.marks.legal,20);logm(G,'Mày mãn hạn tù, trở lại xã hội với án tích: khó xin việc, uy tín thấp.','bad')}
  }else{
    if(P.prof==='nghesi')P.gig=clamp(rnd(0.5,1.4)+P.sk/500,0.5,1.7);
    var sal=salaryMonthly(G);P.lastSal=sal;
    if(age(G)>=62&&P.emp<0){var pn2=pension(G);if(pn2.monthly>0){var pinc=pn2.monthly*3;G.cash+=pinc;R.sal=(R.sal||0)+pinc;if(!P.pensionOn){P.pensionOn=true;logm(G,'Mày bắt đầu nhận lương hưu '+Math.round(pn2.monthly)+' triệu mỗi tháng (đã đóng BHXH '+pn2.years.toFixed(1).replace('.',',')+' năm).','good')}}}
    if(P.emp>=0){
      var tx=clamp((sal/G.infl-15)/110,0,0.35),net=(sal*3*0.895+(qn===1?sal*0.895:0))*(1-tx);G.cash+=net;R.sal=net;R.tax+=sal*3*0.895*tx;G.stats.tax+=sal*3*0.895*tx;G.bhxh.q++;G.bhxh.sum+=sal;
      P.xp++;
      var phys=((P.prof==='nongdan'||P.prof==='congnhan'||P.prof==='xaydung')&&age(G)>55?(age(G)-55)*0.012:0)+(P.prof==='vdv'&&!P.coach&&age(G)>32?(age(G)-32)*0.03:0);
      var perf=clamp(0.45+P.sk/200+(G.plan.cay?0.2:0)-(P.health<40?0.15:0)+(P.net>50?0.05:0)-phys,0.1,1);
      P.perf=P.perf*0.6+perf*0.4;
      var prm=REQ[P.rank];
      if(prm&&P.xp>=prm.q&&P.sk>=prm.sk&&P.rep>=30+8*P.rank){
        var slots=clamp(G.agg.D[P.prof]/(30*(P.rank+1)),0.1,1),pc=(0.1+0.25*P.perf)*slots*(G.plan.cay?1.3:1);
        if(PROF[P.prof].edu>=2&&P.edu<2)pc=0;
        if(Math.random()<pc){P.rank++;P.xp=0;G.stats.promos++;logm(G,'Được thăng chức: '+PROF[P.prof].ranks[P.rank]+'.','good');mem(G,'promo','tôi được thăng lên '+PROF[P.prof].ranks[P.rank].toLowerCase(),1)}
      }
      var lay=(G.flags.recession>0?0.05:0.01)+(G.w[P.prof]<0.9?0.02:0)+(phys>0?0.01:0)+(eraJ(G,P.prof)<0.85?0.015:0);
      if(Math.random()<lay*(1.2-P.perf)){G.cash+=sal*2;P.emp=-1;P.jobless=0;logm(G,'Công ty cắt giảm nhân sự, mày mất việc. Nhận trợ cấp '+Math.round(sal*2)+' triệu.','bad');mem(G,'job','tôi mất việc khi công ty cắt giảm nhân sự và phải đi tìm một chỗ đứng mới',1.5)}
    }else{
      P.jobless++;
      if(P.jobless<=2){var tc=P.lastSal*3*0.4;G.cash+=tc;R.sal=tc}
      if(Math.random()<clamp(0.35+(vacancies(G).ratio)*1.2,0.2,0.8)*(P.record?0.6:1)&&!(P.record&&P.prof==='congchuc')){assignJob(G,false);P.perf=0.5}
    }
  }
  // công trình bất hợp pháp có nguy cơ bị xử lý
  G.T.forEach(function(t,i){
    if(!t.own)return;
    if(t.defect&&t.t!=='empty'&&Math.random()<0.02*enf){var fd=K(G,20)+0.05*bldVal(G,t);G.cash-=fd;logm(G,'Sự cố tại công trình bị lỗi kết cấu ở '+DIST[t.d].name+': bị đình chỉ, phạt '+Math.round(fd)+' triệu và buộc phá dỡ.','bad');addMark(G,'legal',5);G.P.rep=clamp(G.P.rep-5,0,100);if(G.P.emp===i)G.P.emp=-1;t.t='empty';t.lv=0;t.cost=0;t.grow=1;t.defect=false;t.big=false;t.lm=false;t.pname=null;t.zb=false}
    if(t.illegal&&t.t!=='empty'&&Math.random()<0.012*enf){var f=K(G,25);G.cash-=f;logm(G,'Công trình xây không phép của mày bị cưỡng chế tháo dỡ và phạt '+f+' triệu.','bad');t.t='empty';t.lv=0;t.cost=0;t.illegal=false;t.grow=1;addMark(G,'legal',3)}
    if(t.deed&&Math.random()<0.015*enf){logm(G,'Ô đất giấy tay của mày bị tranh chấp: chủ cũ kiện, mày mất trắng ô đất.','bad');t.own=false;t.deed=false;t.landPaid=0;if(t.t!=='empty'){t.illegal=false}t.cost=0;t.prem=1}
  });
  // thu nhập đất, góp vốn
  var rentTotal=0;
  G.T.forEach(function(t){if(t.own&&t.t!=='empty')rentTotal+=plotIncome(G,t)});
  G.stakes.forEach(function(s){var t=G.T[s.i];if(t&&t.t!=='empty')rentTotal+=s.pct*plotIncome(G,t)});
  if(jailed)rentTotal*=0.5;
  var ptax=G.flags.evade?0:rentTotal*0.10;
  if(G.flags.evade&&rentTotal>0)G.evid+=rentTotal*0.10;
  G.cash+=rentTotal-ptax;R.rent=rentTotal;R.tax+=ptax;G.stats.tax+=ptax;
  // sinh hoạt, lãi vay
  var liv=livingQ(G);if(jailed)liv=6*G.infl;G.cash-=liv;R.living=liv;if(P.free>0)P.free--;
  G.mort=Math.max(0.07,0.12+(G.flags.recession>0?-0.01:0)+(G.flags.credit>0?0.025:0));
  var ib=G.debt*(G.mort)/4;G.cash-=ib;R.interest=ib;
  // hành động
  var a=G.plan;
  if(!jailed){
    P.sk=clamp(P.sk+0.5+3.5*(a.hoc||0)+(P.emp>=0?0.1:0),0,100);
    P.net=clamp(P.net+5*(a.net||0)-0.3,0,100);
    P.health=clamp(P.health-2*(a.net||0)-3*(a.cay||0)+8*(a.nghi||0),0,100);
    P.happy=clamp(P.happy+4*(a.nghi||0)-1*(a.cay||0)-(P.health<40?2:0),0,100);
    if(a.bhxh>0&&P.emp<0){G.bhxh.q++;G.bhxh.sum+=8*G.infl}
    for(k in a)R.acts+=a[k]*ACT[k].cost*G.infl;G.cash-=R.acts;
    var pu=pointsUsed(G),over=Math.max(0,pu.used-pu.total);
    if(over>0){P.health=clamp(P.health-3*over,0,100);addMark(G,'health',3*over);logm(G,'Làm quá sức '+over+' điểm: sức khỏe sụt.','bad')}
    else if(!a.nghi)P.health=clamp(P.health+2,0,100);
    if(P.study>0){P.study--;G.cash-=K(G,12);if(P.study===0){P.edu=2;G.stats.degree=1;logm(G,'Mày đã tốt nghiệp đại học tại chức. Giờ mày có thể chuyển sang các nghề cần bằng.','good')}}
  }
  if(age(G)>=45)P.health=clamp(P.health-(age(G)-44)*0.075,0,100);
  if(G.agg&&G.agg.dSvc&&G.agg.dSvc[P.res.d]!=null)P.happy=clamp(P.happy+1.5*(G.agg.dSvc[P.res.d]-0.35),0,100);
  for(k in G.marks){if(k==='legal')G.marks[k]=Math.max(0,G.marks[k]*0.985-0.1);else G.marks[k]=Math.max(0,G.marks[k]*0.96-0.25)}
  if(G.sick>0)G.sick--;
  for(k in a)a[k]=0;
  fixCash(G);
  // điều tra
  var pInv=clamp((G.marks.legal-20)/160,0,0.5)*enf*(1-0.3*P.net/100);
  if(!jailed&&Math.random()<pInv)evs.push(evDieuTra(G));
  R.cash1=G.cash;G.report=R;
  endFlags(G);
  if(qn===4)G.infl*=clamp(1.035+eraMods(G).infl,1.015,1.06);
  G.q++;
  G.hist.pop.push(G.city.pop);if(G.hist.pop.length>80)G.hist.pop.shift();
  PK.forEach(function(p){var h=G.hist.w[p];h.push(G.w[p]);if(h.length>40)h.shift()});
  DK.forEach(function(d){var h=G.hist.land[d];h.push(G.land[d]);if(h.length>40)h.shift()});
  G.net.push(netWorth(G));
  if(G.debt>1500*G.infl&&G.cash<=0&&netWorth(G)<0){G.over=true;G.endKind='soNo'}
  else if(G.q-(G.q0||0)>=Q_TOTAL){G.over=true;G.endKind='done'}
  checkAch(G);
  if(P.prof==='vdv'&&!P.coach&&age(G)===36&&G.q%4===0&&!G.cool.giainghe){G.cool.giainghe=9999;evs.push(evGiaiNghe(G))}
  if(G.auction){G.auction=false;var _ae=evDauGiaKhoi(G);if(_ae)evs.push(_ae)}
  if((G.q-(G.q0||0))%40===0||G.over)snap(G);
  if(!G.over&&(G.q-(G.q0||0))%20===0&&G.q>(G.q0||0))evs.push(evHopLop(G));
  if(!G.over&&!G.P.jail)evs=evs.concat(rollEvents(G));
  else if(!G.over&&G.P.jail>0&&qn===4)evs=evs.concat(rollEvents(G).filter(function(e){return e.id==='tet'||e.id==='benh'}));
  fixEmp(G);
  return {report:R,events:evs};
}
function fixEmp(G){
  var P=G.P;
  if(P.emp>=0&&!(G.T[P.emp]&&JOBS[G.T[P.emp].t]&&JOBS[G.T[P.emp].t][P.prof]&&G.T[P.emp].lv>0)){P.emp=-1;P.jobless=0;logm(G,'Nơi mày làm việc đã bị giải tỏa hoặc chuyển công năng, mày mất việc.','bad')}
}

function checkAch(G){
  if(!G.ach)G.ach={};
  ACH.forEach(function(a){if(!G.ach[a.id]&&a.test(G)){G.ach[a.id]=G.q;logm(G,'Thành tựu: '+a.name+'.','good');if(ACH_MEM[a.id])mem(G,'ach',ACH_MEM[a.id],ACH_W[a.id]||1);G.fx.push({k:'ach',txt:a.name,bad:a.id==='baihoc'})}});
}

  xd:{name:'Xây dựng, bất động sản',m:0.125,pe:9,jobs:{xaydung:0.5,kysu:0.15,ketoan:0.05,congnhan:0.3}},

};
var SK=['xd','sx','bl','cn','yt','nn','kd','tt'];
var CO_MAXLV=9;
function coStaff(lvl){return Math.round(6*Math.pow(2.15,lvl-1))}
var CO_F=[2.4,2.3,2.1,1.9,1.7,1.55,1.4,1.3];
function coBase(lvl){var v=120;for(var i=1;i<lvl;i++)v*=CO_F[i-1];return v}
function coUpCost(G,lvl){return K(G,400*Math.pow(2.1,lvl-1))}
function coDemand(G,sec){return coDemand0(G,sec)*eraD(G,sec)}
function coDemand0(G,sec){
  var A=G.agg,C=G.city,F=G.flags;
  if(sec==='xd')return clamp((A.constructing+8)/22,0.5,1.8)*(F.recession>0?0.55:1);
  if(sec==='sx')return clamp(0.85+C.unemp*3-(G.w.congnhan-1)*0.4,0.5,1.5)*(F.boom>0?1.2:1)*(F.recession>0?0.7:1);
  if(sec==='bl')return clamp(C.pop/(Math.max(1,A.cnt.com)*700+1),0.5,1.6)*(F.epi>0?0.8:1);
  if(sec==='cn')return clamp(0.85+(F.tech>0?0.3:0)+C.pop/100000,0.6,1.4)*(F.recession>0?0.8:1);
  if(sec==='kd')return clamp(tourIdx(G),0.4,1.8)*(F.recession>0?0.85:1);
  if(sec==='tt')return clamp(C.pop/(Math.max(1,A.cnt.sport+A.cnt.culture+A.cnt.fun)*3500+1),0.5,1.6)*(F.epi>0?0.6:1)*(F.recession>0?0.8:1);
  if(sec==='yt')return clamp(C.pop/(Math.max(1,A.cnt.edu+A.cnt.hosp)*2500+1),0.5,1.5);
  return (F.flood>0?0.5:1)*clamp(1.1-C.pop/80000,0.7,1.1);
}
function coProfit4(co){var a=co.profits.slice(-4),v=0;a.forEach(function(x){v+=x});return v}
function coMood(G){return clamp(Math.pow(G.px.ck,0.35),0.6,1.8)}
function coVal(G){
  var co=G.co;if(!co||co.closed)return 0;

}

function ipoCheck(G,ex){

function evIpo(G){
  var co=G.co,mood=coMood(G),val=Math.max(co.cap*0.8,SECTORS[co.sec].pe*mood*Math.max(0,coProfit4(co)))*(co.fake>0?1.2:1),minPct=co.cap>=1000000?0.10:0.15;

    {label:'Chào bán '+Math.round(minPct*100)+'% (mức tối thiểu theo luật)',hint:'Khả năng bán hết cao hơn, huy động ít hơn',do:function(G){return run(minPct,0)}},
    {label:'Chào bán 25% phát hành mới',hint:'Huy động nhiều hơn, khả năng bán hết thấp hơn khi thị trường xấu',do:function(G){return run(0.25,0)}},
    {label:'Chào bán 20% và mày bán thêm 5% cổ phần cá nhân',hint:'Mày bỏ túi một phần tiền ngay',do:function(G){return run(0.2,0.05)}},
    {label:'Hoãn IPO, chờ thị trường tốt hơn',hint:'Chi phí đã bỏ ra không lấy lại; công ty vẫn là công ty cổ phần chưa niêm yết',do:function(G){co.ex0='';return 'Mày hoãn IPO. Hồ sơ phải làm lại khi muốn lên sàn.'}}
  ]);
}

function coStep(G,R,evs){
  var co=G.co;if(!co||co.closed)return;
  var sec=SECTORS[co.sec],dem=coDemand(G,co.sec),jailed=G.P.jail>0,mg=jailed?0.55:(co.ceo?0.92:(G.plan.cay?1.03:1));
  var rev=coBase(co.lvl)*dem*G.infl*mg*(1+randn()*(co.sec==='cn'?0.13:0.07));
  var m=sec.m*(0.6+0.4*dem)-0.02+0.004*Math.min(5,co.lvl-1)-0.005*Math.max(0,co.lvl-5)-(co.ceo?0.03:0);
  if(co.rdb===undefined){co.rdb=0;co.dir=null;co.hit=null;co.lic=0;co.trans=0}

  rev*=compF;m-=0.025*mkI;
  if(PR){rev*=(1+randn()*PR.vol);}
  if(co.pw>0){rev*=1.18;m-=0.05;co.pw--}
  if(co.cartel>0)co.cartel--;
  if(PR){rev*=PR.rv;m+=PR.md}
  if(co.hit&&co.hit.q>0){hitF=1+(co.hit.m-1)*(co.hit.q/co.hit.q0);co.hit.q--;rev*=hitF;m+=0.03}else if(co.hit)co.hit=null;

  m-=co.rdb||0;
  co.fx={cap:coBase(co.lvl)*G.infl,dem:dem,mg:mg,comp:compF,prod:prodF,hit:hitF,lic:licF,tr:trF,pw:pwF,m:m,rd:co.rdb||0};

    if(co.pump===0&&co.pump!==undefined&&G.crimes.thaotung&&Math.random()<0.2)co.mc*=0.85;
  }

    co.closed=true;logm(G,'Doanh nghiệp "'+co.name+'" mất khả năng thanh toán và bị giải thể. Mày mất phần vốn góp.','bad');
    G.fx.push({k:'ach',txt:'Doanh nghiệp phá sản',bad:true});

  else if(!co.closed&&co.lvl>=4&&r>0.97)evs.push(evMna(G));
}

function memoir(G){
  var memoSeen={},P=G.P,periods=[[22,29,'Những năm đầu đi làm'],[30,39,'Tuổi xây dựng'],[40,49,'Tuổi đỉnh cao'],[50,59,'Chặng chuyển giao'],[60,75,'Những năm cuối sự nghiệp']],paras=[],pre=['Năm {a} tuổi, ','Rồi đến năm {a}, ','Đến năm {a} tuổi, ','Năm {a}, '];
  periods.forEach(function(pd){
    if(pd[0]>age(G))return;
    var seen=memoSeen,ev=G.memo.filter(function(m){return m.age>=pd[0]&&m.age<=pd[1]}).slice();
    var nCls=0;ev=ev.filter(function(m){if(m.k==='class'){nCls++;return nCls<=1}return true});
    ev=ev.filter(function(m){var key=m.k==='class'?'class':m.t;if(seen[key]&&m.k!=='law'&&m.k!=='job')return false;seen[key]=1;return true});
    ev.sort(function(a,b){return b.w-a.w||a.q-b.q});ev=ev.slice(0,5);ev.sort(function(a,b){return a.q-b.q});
    var txt=ev.map(function(m,i){return pre[i%4].replace('{a}',m.age)+m.t+'.'}).join(' ');
    if(!ev.length)txt='Những năm ấy trôi qua êm đềm, không có biến cố nào đủ lớn để tôi nhớ mãi.';
    paras.push({h:pd[2]+' ('+pd[0]+' đến '+Math.min(pd[1],age(G))+' tuổi)',t:txt});
  });
  var rows=classRank(G),my=rows.findIndex(function(r){return r.me})+1,nw=netWorth(G)/G.infl,c=[];
  c.push('Nhìn lại, tôi đi qua '+(age(G)-START_AGE)+' năm với nghề '+PROF[P.prof0].name.toLowerCase()+' và những ngã rẽ của mình. So với các bạn cùng lớp, về tiền tôi đứng thứ '+my+' trên '+rows.length+(my===1?', nhưng tiền chưa bao giờ là cách đo duy nhất.':my===rows.length?', nhưng tôi biết mình đã sống theo cách của mình.':'.'));
  c.push((P.fam.married?'Tôi có gia đình'+(P.fam.kids?' và '+P.fam.kids+' đứa con':'')+', điều quý giá hơn mọi con số.':'Tôi chưa lập gia đình, và đôi khi tôi tự hỏi nếu rẽ hướng khác thì cuộc đời sẽ ra sao.')+' Sức khỏe của tôi giờ còn '+Math.round(P.health)+'/100.');
  if((G.stats.jail||0)>0)c.push('Những năm tháng ngồi tù là phần tôi không muốn nhắc nhất, nhưng cũng là bài học đắt giá nhất về chuyện đi đường tắt.');
  else if(G.stats.fines>0||G.stats.evaded>0)c.push('Có những lần tôi suýt đi quá giới hạn của pháp luật; may mà biết dừng lại đúng lúc.');
  else c.push('Tôi giữ được mình trong sạch suốt chặng đường, và giấc ngủ của tôi vì thế mà yên.');
  if(G.co)c.push(G.co.closed?'Doanh nghiệp của tôi đã giải thể, nhưng tôi vẫn không hối tiếc vì đã thử.':G.co.listed?'Doanh nghiệp tôi gây dựng đã lên sàn, với hàng trăm người đi làm mỗi sáng.':'Doanh nghiệp tôi gây dựng vẫn đứng vững, nuôi sống nhiều gia đình.');
  c.push('Thành phố này từ khoảng '+Math.round(G.city.pop0).toLocaleString('vi-VN')+' dân đã lên tới '+Math.round(G.city.pop).toLocaleString('vi-VN')+'. Tôi chỉ là một người trong số họ, nhưng tôi đã thuộc về nó.');
  return {paras:paras,close:c.join(' ')};
}

var CM_NAMES=['Hùng','Lan','Nam','Mai','Tuấn','Hoa','Dũng','Linh','Quân','Thảo','Việt','Ngân'];
var CM_ARCH={an:'an phận làm công ăn lương',lieu:'liều lĩnh, thích đường tắt',dautu:'thích đầu tư tài chính',doi:'hay đổi hướng đi'};
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function initClass(G){
  var pool=shuf(PK.filter(function(p){return p!==G.P.prof})),nm=shuf(CM_NAMES.slice()),ar=['an','lieu','dautu','doi'];
  G.cls=ar.map(function(a,i){var p=pool[i];return {name:nm[i],arch:a,prof:p,rank:0,xp:0,sk:30+rnd(0,18)+(PROF[p].edu>=2?8:0),nw:G.start*rnd(0.6,1.4),status:'ok',jail:0,unemp:0,note:'',record:false,lastNet:0,switched:false}});
}
function classStep(G){
  var A=G.agg,qn=qi(G),a=age(G);
  G.cls.forEach(function(c){
    var pr=PROF[c.prof],sal=0;
    if(c.status==='ok'||c.status==='unemp')sal=pr.base*pr.mult[c.rank]*G.w[c.prof]*G.infl*(c.status==='unemp'?0.4:1);
    var tx=clamp((sal/G.infl-15)/110,0,0.35),net=(sal*3*0.895+(qn===1&&c.status==='ok'?sal*0.895:0))*(1-tx);
    c.nw+=net-(c.status==='jail'?6*G.infl:15*G.infl+0.5*Math.max(0,c.lastNet/G.infl-45)*G.infl);c.lastNet=net;
    if(c.status==='ok'){
      c.sk=clamp(c.sk+0.55,0,100);c.xp++;
      var rq=REQ[c.rank];
      if(rq&&c.xp>=rq.q&&c.sk>=rq.sk&&Math.random()<0.1*clamp(A.D[c.prof]/(30*(c.rank+1)),0.1,1)&&!(c.record&&c.prof==='congchuc')){c.rank++;c.xp=0}
      if(Math.random()<(G.flags.recession>0?0.04:0.008)){c.status='unemp';c.unemp=ri(2,5);c.note='vừa mất việc'}
    }else if(c.status==='unemp'){c.unemp--;if(c.unemp<=0){c.status='ok';c.xp=0;c.note=''}}
    else if(c.status==='jail'){c.jail--;if(c.jail<=0){c.status='ok';c.record=true;c.rank=Math.max(0,c.rank-1);c.note='từng ngồi tù'}}
    if(c.arch==='an')c.nw*=1.0122;
    else if(c.arch==='dautu')c.nw*=(1+0.018+randn()*0.07);
    else if(c.arch==='lieu'&&c.status==='ok'){
      var r=Math.random();
      if(r<0.012){c.nw*=1.9;c.note='làm ăn trúng'}
      else if(r<0.024){c.nw*=0.4;c.note='làm ăn thất bại'}
      else if(r<0.024+0.004*(G.flags.anticorr>0?2.2:1)&&c.nw>200*G.infl){c.status='jail';c.jail=ri(8,18);c.nw*=0.6;c.note='đang ngồi tù'}
    }else if(c.arch==='doi'&&c.status==='ok'&&a>=29&&a<=36&&!c.switched&&Math.random()<0.04){
      var np=PK.filter(function(p){return PROF[p].edu<=PROF[c.prof].edu&&p!==c.prof});
      if(np.length){c.prof=np[Math.floor(Math.random()*np.length)];c.rank=0;c.xp=0;c.sk=Math.max(20,c.sk*0.5);c.switched=true;c.note='đổi sang nghề mới'}
    }
    if(c.nw<-300*G.infl)c.nw=-300*G.infl;
  });
}
function clsText(G,c){
  var pr=PROF[c.prof],st=c.status==='jail'?'đang ngồi tù':c.status==='unemp'?'đang thất nghiệp':pr.ranks[c.rank];
  return c.name+' ('+CM_ARCH[c.arch]+'): '+pr.name+', '+st+(c.note&&c.status==='ok'?', '+c.note:'');
}
function classRank(G){
  var rows=G.cls.map(function(c){return {name:c.name,nw:c.nw/G.infl,me:false,t:clsText(G,c)}});
  rows.push({name:G.P.name||'Tao',nw:netWorth(G)/G.infl,me:true,t:(G.P.name||'Tao')+' (mày): '+PROF[G.P.prof].name+', '+PROF[G.P.prof].ranks[G.P.rank]});
  rows.sort(function(a,b){return b.nw-a.nw});return rows;
}

function evDauGiaKhoi(G){
  var blocks=[],bx,by;
  for(by=1;by<H-1;by+=4)for(bx=1;bx<W-1;bx+=4){
    var ids=[],ok=true,d=null,dx,dy;
    for(dy=0;dy<3;dy++)for(dx=0;dx<3;dx++){
      var x=bx+dx,y=by+dy;if(x>=W||y>=H){ok=false;continue}
      var t=G.T[tidx(x,y)];if(t.t!=='empty'||t.own||t.proj||t.qh||t.d==='tt')ok=false;
      if(d===null)d=t.d;else if(d!==t.d)ok=false;ids.push(tidx(x,y));
    }
    if(ok&&ids.length===9)blocks.push({ids:ids,d:d});
  }
  if(!blocks.length)return null;
  var b=blocks[Math.floor(Math.random()*blocks.length)],pr=0;b.ids.forEach(function(i){pr+=plotPrice(G,G.T[i])});pr=Math.round(pr*0.8);

    {label:'Bỏ qua',hint:'Không đổi',do:function(G){return 'Mày không tham gia.'}}]);

  if(d==='biz')return clamp(0.7+C.pop/30000,0.7,1.6)*(F.recession>0?0.8:1);
  if(d==='ck')return clamp(Math.pow(G.px.ck,0.4),0.5,1.8);
  if(d==='edu')return clamp(C.pop/(Math.max(1,A.cnt.edu)*3500+1),0.5,1.5);
  if(d==='health')return clamp(C.pop/(Math.max(1,A.cnt.hosp)*5000+1),0.5,1.6)*(F.epi>0?1.3:1);
  return coDemand(G,d);
}
function ventHist(v){return v.hist.slice(-4).reduce(function(a,x){return a+x},0)}
function ventValue(G){var v=G.vent;if(!v||v.closed)return 0;return 5*ventHist(v)+0.3*v.paid}
function ventPassive(G){var v=G.vent;if(!v||v.closed||!v.hist.length)return 0;return Math.max(0,ventHist(v)/4)*0.9*(v.mgr?1:0.7)/3}
function ventStart(G){

  if(G.vent&&!G.vent.closed)return 'Mày đã có cơ nghiệp riêng.';if(P.jail>0)return 'Mày đang thụ án.';

}
function ventUpgrade(G){

function ventMgr(G){var v=G.vent;if(!v||v.closed)return '';if(!v.mgr&&v.lvl<2)return 'Cần cấp 2 để thuê người quản lý.';v.mgr=!v.mgr;logm(G,v.mgr?'Mày thuê người quản lý: rảnh 1 điểm thời gian nhưng chia 22% lợi nhuận.':'Mày tự quản lý lại.','news');return ''}
function ventSell(G){var v=G.vent;if(!v||v.closed)return 'Chưa có cơ nghiệp.';var c=Math.round(ventValue(G)*0.9);G.cash+=c;v.closed=true;logm(G,'Mày bán cơ nghiệp "'+VENT[v.prof].name+'" được '+c+' triệu.','news');return ''}
function ventGrant(G){

}
function ventStep(G,R,evs){
  var v=G.vent;if(!v||v.closed)return;
  var D=VENT[v.prof],dem=ventDemand(G,v),P=G.P,jailed=P.jail>0;
  var mg=jailed?0.5:(v.mgr?0.78:1),skf=0.7+0.3*clamp(P.sk,0,100)/100;
  var x=1+randn()*(D.vol||0.12),ev='';
  var r=Math.random();
  if(r<0.04){x*=0.25;ev='shock'}else if(r>0.975){x*=1.8;ev='boom'}
  var inc=D.inc[v.lvl-1]*dem*G.infl*skf*mg*Math.max(0.1,x);
  v.hist.push(inc);if(v.hist.length>12)v.hist.shift();
  var net=inc>0?inc*0.92:inc;G.cash+=net;G.stats.tax+=Math.max(0,inc)*0.08;R.rent=(R.rent||0)+net;
  if(ev==='shock')logm(G,'Cơ nghiệp "'+D.name+'" gặp biến cố: '+D.shock+', thu nhập quý này giảm mạnh.','bad');
  else if(ev==='boom')logm(G,'Cơ nghiệp "'+D.name+'" gặp thời: một hợp đồng lớn khiến thu nhập quý này tăng vọt.','good');
}

var AXES=[['wealth','Giàu có'],['family','Gia đình, hạnh phúc'],['health','Sức khỏe'],['career','Sự nghiệp, tay nghề'],['impact','Đóng góp cho thành phố'],['integrity','Liêm chính, uy tín'],['legacy','Di sản để lại']];
function lifeScore(G){
  var P=G.P,nw=netWorth(G)/G.infl;
  var staff=(G.co&&!G.co.closed?coStaff(G.co.lvl):0)+(G.vent&&!G.vent.closed?ventStaff(G.vent.lvl):0);
  var ax={
    wealth:clamp(100*Math.log(1+Math.max(0,nw)/200)/Math.log(1+30000/200),0,100),
    family:clamp((P.fam.married?30:0)+Math.min(3,P.fam.kids||0)*10+P.happy*0.4,0,100),
    health:clamp(P.health,0,100),
    career:clamp(P.rank*16+P.sk*0.2+(G.vent?G.vent.lvl*3:0)+(G.co&&G.co.listed?10:0),0,100),
    impact:clamp(staff*0.8+(G.stats.proj||0)*12+(G.stats.tax/G.infl)/150,0,100),
    integrity:clamp(P.rep*0.7+(100-Math.min(100,G.marks.legal))*0.3-((G.stats.jail||0)>0?25:0)-(P.record?10:0),0,100),
    legacy:0
  };
  var wsc=100*Math.log(1+Math.max(0,nw)/200)/Math.log(1+30000/200);
  ax.legacy=clamp(Math.min(3,P.fam.kids||0)*14+clamp(wsc,0,100)*0.35+(G.co&&!G.co.closed?10:0)+(G.vent&&!G.vent.closed?8:0)+P.rep*0.15,0,100);
  ax.legacy=clamp(ax.legacy*0.6+dynScore(G).total*0.4,0,100);
  var keys=AXES.map(function(a){return a[0]}),tot=0,mn=100,top=keys[0];
  keys.forEach(function(k){tot+=ax[k];if(ax[k]<mn)mn=ax[k];if(ax[k]>ax[top])top=k});
  tot/=keys.length;
  var T={wealth:['Người làm giàu','Tiền bạc là điểm mạnh nhất của cuộc đời này.'],family:['Người giữ lửa gia đình','Điều đáng giá nhất mày giữ lại là gia đình và những ngày bình yên.'],health:['Người sống khỏe','Mày đi hết đường với một cơ thể còn khỏe, điều hiếm có.'],career:['Bậc thầy của nghề','Mày đi đến tận cùng con đường nghề nghiệp của mình.'],impact:['Người dựng phố','Thành phố có thêm việc làm, công trình và thuế nhờ mày.'],integrity:['Người giữ mình','Mày đi qua cả đời mà giữ được tên tuổi sạch sẽ.'],legacy:['Người để lại cơ đồ','Mày để lại cho các con nhiều hơn tiền: một cơ nghiệp và một cái tên.']};
  var title=T[top];
  if(ax.integrity<30)title=['Người đi đường tắt','Mày đạt được nhiều thứ, nhưng uy tín và sự trong sạch đã trả giá.'];
  else if(mn>=40&&tot>=60)title=['Một đời viên mãn','Không trục nào bị bỏ lại phía sau: tiền, gia đình, sức khỏe, sự nghiệp, đóng góp, liêm chính và di sản cùng đứng vững.'];
  return {ax:ax,total:tot,title:title[0],desc:title[1],top:top};
}

function legacyStart(G,optIdx,prof,name){

  if(!PROF[prof])return 'Chưa chọn nghề cho người kế nghiệp.';

  G.qh.forEach(function(b){if(b.holder==='p'&&b.status==='dev')qhReturn(G,b,true)});

  G.projs.filter(function(p){return !p.done&&!p.failed}).forEach(function(p){projCancel(G,p.id)});
  G.projs=[];

    var acc=0,target=tot*f;
    own.forEach(function(i){var t=G.T[i],v=tileValue(G,t);if(acc+v<=target*1.15&&acc<target){acc+=v}else{t.own=false;t.landPaid=0;t.lm=false;t.pname=null;t.zb=false;t.defect=false;if(G.co&&G.co.tile===i)G.co.tile=-1}});

  if(broke){G.cash=K(G,15);G.debt=0;G.co=null;G.vent=null;G.stakes=[];FK.forEach(function(k){G.fin[k]=0})}
  // người kế nghiệp cần tiền mặt để lo thủ tục và sinh hoạt: bán bớt đất thừa kế (ưu tiên đất trống, rồi công trình nhỏ)
  var need=K(G,250),sold=0;
  if(!broke&&G.cash<need){
    var cand=[];G.T.forEach(function(t,i){if(t.own&&!t.proj)cand.push(i)});
    cand.sort(function(a,b){var ta=G.T[a],tb=G.T[b],ea=ta.t==='empty'?0:1,eb=tb.t==='empty'?0:1;return ea-eb||tileValue(G,ta)-tileValue(G,tb)});
    cand.forEach(function(i){if(G.cash>=need)return;var t=G.T[i],v=tileValue(G,t)*0.98;G.cash+=v;t.own=false;t.landPaid=0;t.lm=false;t.pname=null;t.zb=false;t.defect=false;if(G.co&&G.co.tile===i)G.co.tile=-1;sold++});
  }
  // 3) người kế nghiệp
  var heirEdu=PROF[prof].edu>=2?2:(par.edu>=2?2:1);
  var P={prof:prof,rank:0,sk:20+(par.edu>=2?8:3)+(PROF[prof].edu>=2?12:4),net:Math.round(clamp(par.net*0.6+10,0,100)),rep:clamp(par.rep*0.5+20-(par.record?10:0),10,100),health:90,happy:clamp(65+o.harm,30,100),xp:0,emp:-1,edu:heirEdu,study:0,res:keepHome?{d:par.res.d,own:true,price:par.res.price,base:par.res.base}:{d:rd,own:false,price:0,base:G.land[rd]},fam:{married:false,kids:0},perf:0.6,hops:0,jobless:0,lastSal:0,pay:1,jail:0,record:false,prof0:prof,free:keepHome?0:12,name:(name||'').trim()||('Con của '+(par.name||'Tao'))};
  G.gens.push(old);G.gen++;G.P=P;if(G.leg){P.rep=clamp(P.rep+Math.min(15,G.leg.fame/6),10,100);P.net=clamp(P.net+Math.min(12,G.leg.fame/8),0,100)}G.q0=G.q;G.over=false;G.endKind='';
  G.ach={};G.memo=[];G.snaps=[];G.stats={tax:0,promos:0,jobs:0,built:0,events:0};G.crimes={};G.evid=0;G.secQ=[];G.marks={legal:0,health:0,trust:0};
  G.plan={hoc:0,net:0,nghi:0,cay:0,bhxh:0};G.sick=0;G.bhxh={q:0,sum:0};G.sched=[];G.fx=[];G.grant=false;G.start=K(G,100);

function qhInvestors(){return [{id:1,name:'Tập đoàn Trần Land',style:'aggr'},{id:2,name:'Công ty gia đình Lê Home',style:'safe'},{id:3,name:'Startup Phạm Prop',style:'start'},{id:4,name:'Quỹ ngoại Orion Land',style:'fund'}]}
function qhMatch(zone,t){return t.t!=='empty'&&(QH_TYPES[zone]||[]).indexOf(t.t)>=0}
function qhBlock(G,id){for(var i=0;i<G.qh.length;i++)if(G.qh[i].id===id)return G.qh[i];return null}
function qhNews(G,t){if(!G.qhlog)G.qhlog=[];G.qhlog.push({q:G.q,t:t});if(G.qhlog.length>14)G.qhlog.shift();logm(G,t,'news')}
function qhPrice(G,b,mult){var v=0;b.ids.forEach(function(i){v+=plotPrice(G,G.T[i])});return Math.round(v*mult)}
function qhClearTiles(G,b){b.ids.forEach(function(i){var t=G.T[i];t.own=false;t.landPaid=0;if(t.proj){var p=projFind(G,t.proj);if(p&&!p.done&&!p.failed)projCancel(G,p.id)}if(t.t!=='empty'&&!t.fromBot){t.t='empty';t.lv=0;t.cost=0;t.grow=1;t.big=false;t.lm=false;t.pname=null;t.zb=false;t.defect=false;t.illegal=false}})}
function qhScore(G,b){
  var cx=0,cy=0,adj=0;b.ids.forEach(function(i){cx+=G.T[i].x;cy+=G.T[i].y});cx/=b.ids.length;cy/=b.ids.length;
  G.T.forEach(function(t){if(t.t!=='empty'&&t.t!=='road'&&t.t!=='bridge'&&t.t!=='water'&&t.t!=='locked'&&Math.abs(t.x-cx)+Math.abs(t.y-cy)<=7)adj++});
  return {dist:Math.abs(cx-16)+Math.abs(cy-12),adj:adj};
}
function qhBuy(G,b,mult){
  if(G.P.jail>0)return 'Mày đang thụ án.';
  var pr=qhPrice(G,b,mult);if(G.cash<pr)return 'Không đủ tiền (cần '+pr.toLocaleString('vi-VN')+' triệu).';
  G.cash-=pr;b.holder='p';b.hn=G.P.name||'Tao';b.status='dev';b.paid=pr;b.t0=G.q;b.d1=G.q+4;b.d2=G.q+20;b.ext=false;b.warned=false;
  b.ids.forEach(function(i){var t=G.T[i];t.own=true;t.landPaid=pr/b.ids.length});
  logm(G,'Mày nhận giao khối đất quy hoạch '+QH_ZNAME[b.zone]+' ở '+DIST[b.d].name+' ('+pr+' triệu). Hạn: khởi công trong 4 quý, hoàn thành đúng quy hoạch trong 20 quý (5 năm).','news');return '';
}
function qhAssignBot(G,b){
  var w=[],tot=0;G.invs.forEach(function(v){var x=v.style==='aggr'?1.4:v.style==='safe'?1:v.style==='start'?0.8:(G.city.pop>=15000?1.2:0);w.push(x);tot+=x});
  var r=Math.random()*tot,k=0;for(;k<w.length-1;k++){if(r<w[k])break;r-=w[k]}
  var v=G.invs[k],dev={aggr:ri(5,9),safe:ri(8,12),start:ri(6,14),fund:ri(6,10)}[v.style];
  b.holder='b';b.inv=v.id;b.hn=v.name;b.status='dev';b.t0=G.q;b.q=0;b.dev=dev;b.paid=0;
  qhNews(G,v.name+' trúng đấu giá khối quy hoạch '+QH_ZNAME[b.zone]+' ở '+DIST[b.d].name+'.');
}
function qhRecover(G,b,why){
  var wasP=b.holder==='p',refund=0;G.stats[wasP?'qhPRec':'qhBRec']=(G.stats[wasP?'qhPRec':'qhBRec']||0)+1;
  if(wasP){
    refund=Math.round(QH_REFUND_REC*b.paid);G.cash+=refund;G.P.rep=clamp(G.P.rep-5,0,100);addMark(G,'legal',3);
    mem(G,'land','Nhà nước thu hồi khối đất quy hoạch của tôi vì chậm tiến độ, tôi chỉ được hoàn lại một phần',2);
  }
  qhNews(G,(wasP?'Nhà nước thu hồi khối đất quy hoạch '+QH_ZNAME[b.zone]+' ở '+DIST[b.d].name+' của mày ('+why+'): hoàn lại '+refund.toLocaleString('vi-VN')+' triệu (45% giá nhận đất, nhẹ hơn luật thật: luật quy định không bồi thường), công trình dở dang bị phá dỡ.':'Nhà nước thu hồi khối quy hoạch của '+b.hn+' ('+why+'), sẽ giao lại cho nhà đầu tư khác.'));
  qhClearTiles(G,b);b.holder=null;b.hn='';b.status='recovered';b.rec=G.q;b.offered=false;b.paid=0;
}
function qhReturn(G,b,silent){
  if(b.holder!=='p'||b.status!=='dev')return 'Khối này không thuộc mày.';
  var refund=Math.round(QH_REFUND_VOL*b.paid);G.cash+=refund;
  if(!silent)logm(G,'Mày trả lại khối đất quy hoạch '+QH_ZNAME[b.zone]+' cho Nhà nước, hoàn '+refund.toLocaleString('vi-VN')+' triệu (55% giá nhận đất).','news');
  qhClearTiles(G,b);b.holder=null;b.hn='';b.status='recovered';b.rec=G.q;b.offered=true;b.paid=0;return '';
}
function evQhAuction(G,blocks,round){
  var ch=[];
  blocks.slice(0,3).forEach(function(b){var pr=qhPrice(G,b,1.05);ch.push({label:'Đấu giá khối '+QH_ZNAME[b.zone]+' ở '+DIST[b.d].name+' ('+pr.toLocaleString('vi-VN')+' triệu)',hint:'9 ô liền kề. Phải khởi công trong 4 quý và hoàn thành đúng quy hoạch trong 20 quý (5 năm), nếu không bị thu hồi và chỉ được hoàn lại 45%',do:function(G){var m=qhBuy(G,b,1.05);qhBotsTake(G,blocks);return m||'Mày trúng đấu giá khối đất quy hoạch.'}})});
  ch.push({label:'Không tham gia',hint:'Các nhà đầu tư khác sẽ nhận hết',do:function(G){qhBotsTake(G,blocks);return 'Mày để các nhà đầu tư khác tranh nhau.'}});
  return mkEv('qhauction','Công bố đợt quy hoạch lần '+round,'Sau 5 năm, thành phố công bố đợt quy hoạch mới ở những vùng xa trung tâm sắp được mở rộng: '+blocks.map(function(b){return QH_ZNAME[b.zone]+' ở '+DIST[b.d].name}).join('; ')+'. Các khối được đấu giá quyền sử dụng đất. Ai trúng phải xây đúng loại quy hoạch đúng hạn, ai chậm bị thu hồi và giao lại cho nhà đầu tư có năng lực.',ch);
}
function qhBotsTake(G,blocks){blocks.forEach(function(b){if(b.status==='auction')qhAssignBot(G,b)})}
function evQhGiaHan(G,b){
  var fee=Math.round(0.10*b.paid);
  return mkEv('qhgiahan','Khối quy hoạch chưa khởi công','Khối đất '+QH_ZNAME[b.zone]+' ở '+DIST[b.d].name+' đã quá 12 tháng mà mày chưa khởi công. Theo luật thật (Điều 81 Luật Đất đai 2024), chủ đầu tư chậm được gia hạn tối đa 24 tháng và phải nộp thêm khoản tiền tương ứng tiền sử dụng đất cho thời gian gia hạn; hết hạn vẫn chưa dùng đất thì bị thu hồi.',[
    {label:'Gia hạn 8 quý, nộp '+fee.toLocaleString('vi-VN')+' triệu',hint:'Hạn hoàn thành lùi thêm 8 quý',do:function(G){if(G.cash<fee)return 'Không đủ tiền nộp phí gia hạn. Khối đất vẫn giữ hạn cũ.';G.cash-=fee;b.d2+=8;b.ext=true;b.warned=true;return 'Mày được gia hạn thêm 8 quý.'}},
    {label:'Trả lại đất, hoàn lại 55%',hint:'Thoát nhẹ nhàng, không bị tính vi phạm',do:function(G){qhReturn(G,b);return 'Mày trả lại khối đất cho Nhà nước.'}},
    {label:'Cố khởi công ngay, không gia hạn',hint:'Không mất phí, nhưng hạn hoàn thành vẫn giữ nguyên',do:function(G){b.warned=true;return 'Mày quyết khởi công ngay.'}}]);
}
function evQhRebid(G,b){
  var pr=qhPrice(G,b,0.85);
  return mkEv('qhrebid','Đất bị thu hồi được giao lại','Khối đất quy hoạch '+QH_ZNAME[b.zone]+' ở '+DIST[b.d].name+' vừa bị thu hồi của chủ cũ vì chậm tiến độ. Nhà nước giao lại cho nhà đầu tư có năng lực thi công đúng quy hoạch, giá thấp hơn 15%.',[
    {label:'Nhận giao đất ('+pr.toLocaleString('vi-VN')+' triệu)',hint:'Hạn mới: khởi công trong 4 quý, hoàn thành trong 20 quý',do:function(G){var m=qhBuy(G,b,0.85);return m||'Mày nhận giao lại khối đất.'}},
    {label:'Bỏ qua',hint:'Các nhà đầu tư khác sẽ nhận',do:function(G){return 'Mày không nhận.'}}]);
}
function qhStep(G,evs){
  if(!G.qh)return;
  // công bố đợt mới mỗi 5 năm, chỉ ở vùng chưa có quy hoạch
  if(G.q>=20&&G.q%20===0){
    var nb=Math.min(5,2+Math.floor(G.city.pop/15000)),cand=planBlocks(G).filter(function(b){return b.d!=='tt'&&b.ids.every(function(i){var t=G.T[i];return !t.zone&&!t.qh&&!t.own&&!t.proj})});
    cand.forEach(function(b){b.s=qhScore(G,b)});cand=cand.filter(function(b){return b.s.adj>=2});
    cand.sort(function(a,b){return (b.s.dist*0.6+b.s.adj*1.2)-(a.s.dist*0.6+a.s.adj*1.2)});
    var picked=cand.slice(0,nb),blocks=[];
    picked.forEach(function(c){var b={id:++G.qhId,ids:c.ids,zone:zoneFor(G,c.d),d:c.d,holder:null,hn:'',status:'auction',paid:0,t0:0,d1:0,d2:0,ext:false,warned:false,created:G.q,round:0};
      c.ids.forEach(function(i){var t=G.T[i];t.qh=b.id;t.zone=b.zone});G.qh.push(b);blocks.push(b)});
    if(blocks.length){
      G.qhRound++;blocks.forEach(function(b){b.round=G.qhRound});
      qhNews(G,'Đợt quy hoạch lần '+G.qhRound+' được công bố: '+blocks.length+' khối ở vùng mở rộng ('+blocks.map(function(b){return QH_ZNAME[b.zone]+' ở '+DIST[b.d].name.split(' (')[0]}).join(', ')+').');
      hl(G,blocks[0].d,'Quy hoạch mới');
      var can=blocks.some(function(b){return G.cash>=qhPrice(G,b,1.05)*0.6})&&G.P.jail<=0;
      if(can)evs.push(evQhAuction(G,blocks,G.qhRound));else qhBotsTake(G,blocks);
    }
  }
  G.qh.forEach(function(b){
    if(b.status==='dev'&&b.holder==='p'){
      var match=0,started=false;
      b.ids.forEach(function(i){var t=G.T[i];
        if(t.proj)started=true;
        if(t.t!=='empty'&&!t.proj){
          if(qhMatch(b.zone,t)){started=true;if(t.lv>=2&&t.grow>=1)match++}
          else{var fine=K(G,20)+0.05*bldVal(G,t);G.cash-=fine;logm(G,'Xây sai quy hoạch ở '+DIST[b.d].name+': công trình bị buộc tháo dỡ, phạt '+Math.round(fine)+' triệu. Khối này chỉ được xây loại '+QH_ZNAME[b.zone]+'.','bad');addMark(G,'legal',3);t.t='empty';t.lv=0;t.cost=0;t.grow=1;t.big=false;t.lm=false;t.pname=null;t.zb=false;t.defect=false;t.illegal=false}}
      });
      if(match>=7){b.status='done';G.stats.qhDone=(G.stats.qhDone||0)+1;qhNews(G,'Mày hoàn thành đúng quy hoạch khối '+QH_ZNAME[b.zone]+' ở '+DIST[b.d].name+'.');mem(G,'land','tôi xây xong một khu theo đúng quy hoạch của thành phố',1.5);b.ids.forEach(function(i){var t=G.T[i];t.qh=null})}
      else if(!started&&G.q>=b.d1&&!b.warned&&!b.ext)evs.push(evQhGiaHan(G,b));
      else if(G.q>=b.d2)qhRecover(G,b,'không hoàn thành đúng quy hoạch đúng hạn');
    }else if(b.status==='dev'&&b.holder==='b'){
      b.q++;
      if(b.q>=b.dev){
        var v=null;G.invs.forEach(function(x){if(x.id===b.inv)v=x});var ok={aggr:0.7,safe:0.95,start:0.6,fund:0.97}[v?v.style:'safe'];
        if(Math.random()<ok){
          var types=QH_TYPES[b.zone];b.ids.forEach(function(i,j){var t=G.T[i];t.t=types[j%types.length];t.lv=2;t.grow=0.2;t.qh=null;t.zone=null;t.fromBot=true});
          b.status='done';G.stats.qhBotDone=(G.stats.qhBotDone||0)+1;qhNews(G,b.hn+' hoàn thành khu '+QH_ZNAME[b.zone]+' ở '+DIST[b.d].name+', thành phố có thêm công trình.');
        }else qhRecover(G,b,'chậm tiến độ, không đủ năng lực thi công');
      }
    }else if(b.status==='recovered'){
      if(!b.offered){b.offered=true;if(G.P.jail<=0&&G.cash>=qhPrice(G,b,0.85)*0.6)evs.push(evQhRebid(G,b))}
      else if(G.q-b.rec>=2&&Math.random()<0.5)qhAssignBot(G,b);
    }
  });
  G.qh=G.qh.filter(function(b){return b.status!=='done'||G.q-(b.t0||0)<40}).slice(-30);
}
ACH.splice(ACH.length-1,0,{id:'dungqh',name:'Đúng quy hoạch',desc:'Hoàn thành một khối đất đợt quy hoạch đúng hạn.',test:function(G){return (G.stats.qhDone||0)>=1}});

function qhProg(G,b){
  var match=0,started=false;
  b.ids.forEach(function(i){var t=G.T[i];if(t.proj)started=true;if(t.t!=='empty'&&!t.proj&&qhMatch(b.zone,t)){started=true;if(t.lv>=2&&t.grow>=1)match++}});
  return {match:match,started:started};
}

var ERA_IDS=['urban','fintech','ai','climate','aging','metro'];

}
/* hệ số hiện hành (đã nội suy giữa thời đại trước và thời đại hiện tại) */

  var c=eraDef(E.id),p=E.prev?eraDef(E.prev):ERA_NEUTRAL,t=b,k,m={};
  m.job=lerpMap(p.job,c.job,t,1);m.land=lerpMap(p.land,c.land,t,1);m.need=lerpMap(p.need,c.need,t,1);
  m.yld=lerpMap(p.yld,c.yld,t,1);m.yldD=lerpMap(p.yldD,c.yldD,t,1);m.dem=lerpMap(p.dem,c.dem,t,1);
  m.evw=lerpMap(p.evw,c.evw,t,1);m.wantMul=lerpMap(p.wantMul,c.wantMul,t,1);
  var pd=(p.decay||{}),cd=(c.decay||{});

  m.wf=(p.wf||0.5)+((c.wf||0.5)-(p.wf||0.5))*t;m.infl=(p.infl||0)+((c.infl||0)-(p.infl||0))*t;

/* chu kỳ tính theo quý; tương ứng khoảng 30 đến 50 năm, trong khung 25 đến 50 năm cho "nhà cửa kiên cố" của
   Phụ lục 1 Thông tư 45/2013/TT-BTC về khấu hao tài sản cố định (nên đối chiếu văn bản hiện hành) */
var WEAR_Q={fin:0.0052,res:0.0055,com:0.0062,ind:0.0075,farm:0.004,office:0.0058,edu:0.0045,hosp:0.005,gov:0.0045,hotel:0.007,sport:0.006,culture:0.005,fun:0.0078};
var WEAR_SKIP={road:1,bridge:1,water:1,locked:1,empty:1};
function wearRate(G,t){
  var b=WEAR_Q[t.t];if(!b)return 0;
  var m=eraMods(G).decay,r=b*m.all*(m.d[t.d]!==undefined?m.d[t.d]:1);
  if(t.dyke&&m.d[t.d]>1.5)r*=0.5;
  if(t.defect)r*=1.5;if(t.illegal)r*=1.3;
